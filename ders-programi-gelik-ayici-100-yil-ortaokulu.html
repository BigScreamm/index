<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ders Programı Hazırlayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====================== TASARIM SİSTEMİ ======================
   Ana renk: kurumsal lacivert. Her modülün kendi vurgu rengi (--mod) vardır.
   Tüm metin/arka plan çiftleri WCAG 2.1 AA (4.5:1) için seçilmiştir. */
:root{
  --brand:#1e3a8a;--brand-ink:#ffffff;
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#f7f8fb;--panel3:#eef1f6;--text:#111827;--muted:#5b6475;--line:#e3e7ee;--line2:#d5dbe5;
  --danger:#b42318;--danger-2:#fdecea;--ok:#12703f;--ok-2:#e6f5ed;--warn:#9a5b00;--warn-2:#fff4df;--info:#0b5cad;--info-2:#e7f1fb;
  --closed:#f4dcdc;--tgt:#d5f5e3;--side:#0e1a3a;--side-2:#15244d;--side-ink:#c5cee4;--side-mute:#8392b5;
  --tek:#f59e0b;--tek-bg:#fff1d6;--tek-ink:#7a4100;
  --r-sm:8px;--r:12px;--r-lg:16px;
  --sh-1:0 1px 2px rgba(16,24,40,.05);--sh-2:0 1px 3px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);--sh-3:0 12px 40px rgba(16,24,40,.18);
  --ease:cubic-bezier(.2,.7,.2,1);
  /* modül renkleri */
  --m-genel:#1e3a8a;--m-ayar:#334155;--m-ders:#6d28d9;--m-ogr:#0f766e;--m-sinif:#1d4ed8;--m-dlik:#a1530a;--m-atama:#4338ca;--m-kural:#c2410c;--m-prog:#047857;--m-nobet:#be123c;--m-veri:#475569;
  --mod:var(--m-genel);--mod-ink:#ffffff;--cellmix:16%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--cellmix:30%}}
:root[data-theme=dark]{--cellmix:30%}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){
  --brand:#9db8ff;--brand-ink:#0b1430;
  --bg:#0c111b;--panel:#141a26;--panel2:#1a2130;--panel3:#20283a;--text:#e8ebf2;--muted:#a3adc2;--line:#283146;--line2:#33405a;
  --danger:#ff8a80;--danger-2:#3a1d1d;--ok:#5ee2a0;--ok-2:#14301f;--warn:#ffc061;--warn-2:#38290f;--info:#7cc0ff;--info-2:#14283d;
  --closed:#472830;--tgt:#16482f;--side:#080d18;--side-2:#111a2e;--tek:#f8b84e;--tek-bg:#3a2a0e;--tek-ink:#ffd591;
  --sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 1px 3px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);--sh-3:0 12px 40px rgba(0,0,0,.6);
  --m-genel:#9db8ff;--m-ayar:#aab6c8;--m-ders:#c3a6ff;--m-ogr:#4fd1c0;--m-sinif:#8fb2ff;--m-dlik:#f6b44a;--m-atama:#b2b4ff;--m-kural:#ff9f66;--m-prog:#4ade9b;--m-nobet:#ff8aa0;--m-veri:#b4c0d2;--mod-ink:#0b1220;}}
:root[data-theme=dark]{
  --brand:#9db8ff;--brand-ink:#0b1430;
  --bg:#0c111b;--panel:#141a26;--panel2:#1a2130;--panel3:#20283a;--text:#e8ebf2;--muted:#a3adc2;--line:#283146;--line2:#33405a;
  --danger:#ff8a80;--danger-2:#3a1d1d;--ok:#5ee2a0;--ok-2:#14301f;--warn:#ffc061;--warn-2:#38290f;--info:#7cc0ff;--info-2:#14283d;
  --closed:#472830;--tgt:#16482f;--side:#080d18;--side-2:#111a2e;--tek:#f8b84e;--tek-bg:#3a2a0e;--tek-ink:#ffd591;
  --sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 1px 3px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);--sh-3:0 12px 40px rgba(0,0,0,.6);
  --m-genel:#9db8ff;--m-ayar:#aab6c8;--m-ders:#c3a6ff;--m-ogr:#4fd1c0;--m-sinif:#8fb2ff;--m-dlik:#f6b44a;--m-atama:#b2b4ff;--m-kural:#ff9f66;--m-prog:#4ade9b;--m-nobet:#ff8aa0;--m-veri:#b4c0d2;--mod-ink:#0b1220;}
[data-mod=genel]{--mod:var(--m-genel)}[data-mod=ayar]{--mod:var(--m-ayar)}[data-mod=ders]{--mod:var(--m-ders)}[data-mod=ogr]{--mod:var(--m-ogr)}[data-mod=sinif]{--mod:var(--m-sinif)}[data-mod=dlik]{--mod:var(--m-dlik)}
[data-mod=atama]{--mod:var(--m-atama)}[data-mod=kural]{--mod:var(--m-kural)}[data-mod=prog]{--mod:var(--m-prog)}[data-mod=nobet]{--mod:var(--m-nobet)}[data-mod=veri]{--mod:var(--m-veri)}
:root{--mod-2:color-mix(in srgb,var(--mod) 11%,var(--panel));--mod-3:color-mix(in srgb,var(--mod) 22%,var(--panel));--focus:0 0 0 3px color-mix(in srgb,var(--mod) 40%,transparent)}
[data-mod]{--mod-2:color-mix(in srgb,var(--mod) 11%,var(--panel));--mod-3:color-mix(in srgb,var(--mod) 22%,var(--panel));--focus:0 0 0 3px color-mix(in srgb,var(--mod) 40%,transparent)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
:focus-visible{outline:none;box-shadow:var(--focus)!important}
.skip{position:absolute;left:12px;top:-60px;background:var(--brand);color:var(--brand-ink);padding:10px 14px;border-radius:var(--r-sm);z-index:50;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- yerleşim ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--side) 0%,var(--side-2) 100%);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:6px}
.logo{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center;color:#1e3a8a;flex:none}
.logo svg.i{width:22px;height:22px}
.brand b{display:block;color:#fff;font-size:13.5px;line-height:1.25}
.brand span{font-size:11.5px;color:var(--side-mute)}
.navg{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute);padding:12px 10px 4px;font-weight:600}
aside nav{display:flex;flex-direction:column;gap:2px}
.nb{appearance:none;border:0;background:none;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:9px;color:var(--side-ink);font-weight:500;text-align:left;width:100%;transition:background .15s var(--ease),color .15s}
.nb .chip{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 45%,#fff);flex:none;transition:.15s}
.nb .chip svg.i{width:16px;height:16px}
.nb:hover{background:rgba(255,255,255,.06);color:#fff}
.nb[aria-current=page]{background:rgba(255,255,255,.1);color:#fff}
.nb[aria-current=page] .chip{background:var(--c);color:#fff}
.nb .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.08);padding:1px 8px;border-radius:9px;color:var(--side-ink)}
.nb .st{margin-left:auto;width:8px;height:8px;border-radius:50%}
.side-foot{margin-top:auto;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:var(--side-mute)}
.side-foot button{appearance:none;border:0;background:none;color:var(--side-ink);font:inherit;cursor:pointer;display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;width:100%}
.side-foot button:hover:not(:disabled){background:rgba(255,255,255,.06)}
.side-foot button:disabled{opacity:.4;cursor:default}
main{padding:26px 30px 48px;min-width:0;max-width:1480px;width:100%;margin:0 auto}

/* ---------- sayfa başlığı ---------- */
.ph{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.ph .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:var(--mod-ink);background:var(--mod);box-shadow:0 6px 18px color-mix(in srgb,var(--mod) 35%,transparent);flex:none}
.ph .ic svg.i{width:25px;height:25px}
.ph .kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mod)}
.ph h1{margin:1px 0 0;font-size:22px;letter-spacing:-.015em;line-height:1.2}
.ph p{margin:3px 0 0;color:var(--muted)}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- kartlar ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:16px;box-shadow:var(--sh-1)}
.card h2{font-size:15px;margin:0 0 14px;display:flex;gap:9px;align-items:center;letter-spacing:-.005em}
.hi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--mod-2);color:var(--mod)}
.hi svg.i{width:16px;height:16px}
.card h2 svg.i{color:var(--mod)}
.card.accent{border-top:3px solid var(--mod)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* ---------- form ---------- */
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 10px;outline:none;transition:border-color .15s,box-shadow .15s;min-height:36px}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--mod) 45%,var(--line2))}
input:focus,select:focus,textarea:focus{border-color:var(--mod);box-shadow:var(--focus)}
/* sıfır öncelikli: .w-60 gibi genişlik sınıfları bu varsayılanı ezebilsin */
:where(input[type=number]){width:78px}
input[type=checkbox]{width:17px;height:17px;min-height:0;accent-color:var(--mod);vertical-align:-3px}
input[type=color]{min-height:0}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}

/* ---------- düğmeler ---------- */
.btn{font:inherit;font-weight:600;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:9px;cursor:pointer;min-height:36px;transition:background .15s var(--ease),border-color .15s,color .15s,transform .08s,box-shadow .15s}
.btn:hover{border-color:var(--mod);color:var(--mod);background:var(--mod-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.p{background:var(--mod);border-color:var(--mod);color:var(--mod-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--mod) 30%,transparent)}
.btn.p:hover{filter:brightness(1.08);color:var(--mod-ink);background:var(--mod)}
.btn.d{color:var(--danger)}.btn.d:hover{border-color:var(--danger);background:var(--danger-2);color:var(--danger)}
.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:7px;min-height:30px}
.btn.ico{padding:5px 8px}
.btn.big{padding:10px 20px;font-size:15px;min-height:44px}

/* ---------- tablolar ---------- */
table.t{border-collapse:separate;border-spacing:0;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.t thead th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--panel2);position:sticky;top:0;z-index:1}
table.t thead th:first-child{border-top-left-radius:10px}table.t thead th:last-child{border-top-right-radius:10px}
table.t tbody tr{transition:background .12s}
table.t tbody tr:hover td{background:var(--panel2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- ders programı tablosu ---------- */
.grid{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
.grid th,.grid td{padding:5px;text-align:center;font-size:12px;border-radius:9px}
.grid thead th{color:var(--muted);font-weight:600;font-size:11.5px}
.grid tbody th{width:96px;background:var(--panel3);font-weight:700;font-size:12.5px}
.grid tbody tr:nth-child(odd) th{background:color-mix(in srgb,var(--mod) 9%,var(--panel3))}
.grid td{height:60px;background:var(--panel2);border:1px solid transparent}
.grid td.x{background:repeating-linear-gradient(45deg,var(--closed),var(--closed) 5px,transparent 5px,transparent 10px)}
.grid td.f{cursor:pointer;transition:transform .12s var(--ease),box-shadow .12s}
.grid td.f:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.grid td.sel{border:2px solid var(--mod);box-shadow:var(--focus)}
.grid td.tgt{background:var(--tgt);cursor:pointer;border:1.5px dashed var(--ok);color:var(--ok);font-weight:700}
.grid td .s1{font-weight:700;display:block;line-height:1.25}
.grid td .s2{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.mgrid{border-collapse:collapse;font-size:11px}
.mgrid th,.mgrid td{border:1px solid var(--line);padding:3px 4px;text-align:center;white-space:nowrap}
.mgrid td{min-width:48px}
.mgrid th.dh{background:var(--mod-2);color:var(--mod)}
.mgrid td.ds,.mgrid th.ds{border-left:2px solid var(--line2)}

/* ---------- küçük bileşenler ---------- */
.pill{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:20px;background:var(--mod-2);font-size:12.5px;margin:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tag{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em}
.badge.ok{background:var(--ok-2);color:var(--ok)}.badge.warn{background:var(--warn-2);color:var(--warn)}.badge.err{background:var(--danger-2);color:var(--danger)}.badge.info{background:var(--info-2);color:var(--info)}.badge.mute{background:var(--panel3);color:var(--muted)}
.badge.tek{background:var(--tek);color:#3a1d00}
.okc{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--danger)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:10px;font-size:13px;margin:8px 0;border:1px solid transparent}
.note.e{background:var(--danger-2);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 25%,transparent)}
.note.w{background:var(--warn-2);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.note.i{background:var(--info-2);color:var(--info);border-color:color-mix(in srgb,var(--info) 20%,transparent)}
.note.o{background:var(--ok-2);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.note svg.i{margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;transition:transform .15s var(--ease),box-shadow .15s}
.stat:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.stat .si{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.stat .si.a{background:var(--mod-2);color:var(--mod)}.stat .si.o{background:var(--ok-2);color:var(--ok)}.stat .si.w{background:var(--warn-2);color:var(--warn)}.stat .si.e{background:var(--danger-2);color:var(--danger)}.stat .si.i{background:var(--info-2);color:var(--info)}
.stat b{display:block;font-size:20px;line-height:1.1;letter-spacing:-.01em}
.stat span{font-size:11.5px;color:var(--muted)}
.cgrid td{width:40px;height:32px;cursor:pointer}
.cgrid td.on{background:var(--danger);color:#fff}
.chk{display:flex;flex-wrap:wrap;gap:6px 16px;max-height:200px;overflow:auto;border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--panel2)}
.chk label{white-space:nowrap;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{appearance:none;border:0;background:none;font:inherit;color:var(--text);cursor:pointer;padding:7px 12px;display:flex;gap:6px;align-items:center;font-size:13px;font-weight:500;transition:background .15s}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--panel2)}
.seg button[aria-pressed=true]{background:var(--mod-2);color:var(--mod);font-weight:700}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--mod-2);color:var(--mod);margin:0 auto 12px}
.empty .eic svg.i{width:30px;height:30px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.rules td:first-child{width:58%}
.rules input[type=number]{width:96px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.preset{border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;background:var(--panel);transition:.15s var(--ease);text-align:left;font:inherit;color:inherit}
.preset:hover{border-color:var(--mod);transform:translateY(-2px);box-shadow:var(--sh-2)}
.preset b{display:flex;gap:7px;align-items:center;color:var(--mod)}
.preset p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.prog{margin-top:12px}
.bar{height:8px;background:var(--panel3);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mod);width:0;transition:width .3s var(--ease)}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:8px}
.wk div{font-size:12px;background:var(--panel2);border-radius:8px;padding:6px 10px;border:1px solid var(--line)}

/* ---------- genel bakış ---------- */
.hero{border-radius:var(--r-lg);padding:22px 24px;background:linear-gradient(120deg,#1e3a8a 0%,#2746a3 55%,#3557b8 100%);color:#fff;margin-bottom:16px;box-shadow:var(--sh-2);display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.hero h1{margin:0;font-size:24px;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:#d6e0ff}
.hero .hs{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.hero .hs div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 14px;min-width:96px}
.hero .hs b{display:block;font-size:21px;line-height:1.1}
.hero .hs span{font-size:11.5px;color:#d6e0ff}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.step{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .15s,border-color .15s}
.step::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.step:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.step .sic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--c);flex:none}
.step .n{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.step b{display:block;font-size:14.5px;margin:1px 0 3px}
.step p{margin:0;font-size:12.5px;color:var(--muted)}
.step .badge{position:absolute;top:12px;right:12px}

/* ---------- nöbet çizelgesi ---------- */
.duty{border-collapse:separate;border-spacing:0 0;width:100%;min-width:680px}
.duty th,.duty td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}

    u.blockObjs.forEach((x,i)=>{x.i=i;x.key=u.key+'#'+i;this.byKey.set(x.key,x);});
    this.blocks=this.blocks.filter(x=>x!==b).concat(np);u.oneADay=u.blocks.length<=this.D;u.split=true;return np;
  }
  /* --- 2. aşama: iyileştirme (tavlama benzetimi) --- */
  mvMove(b){const D=this.D,P=this.P,od=b.d,os=b.s;
    for(let t=0;t<12;t++){const d=(rand()*D)|0,s=(rand()*(P-b.len+1))|0;if(d===od&&s===os)continue;if(this.conflicts(b,d,s)!==0)continue;
      const days=d===od?[d]:[od,d];const before=this.evalCost(b.u.ri,days,[b.u]);this.remove(b);this.place(b,d,s);return this.evalCost(b.u.ri,days,[b.u])-before;}
    return null;}
  mvSwap(b){const r0=b.u.ci!==undefined?b.u.ci:b.u.ri[0];if(r0===undefined)return null;const oc=this.occA[r0];
    for(let t=0;t<10;t++){const c=oc[(rand()*this.N)|0];if(!c||c===b||c.u===b.u||c.locked||c.len!==b.len)continue;
      const od=b.d,os=b.s,cd=c.d,cs=c.s,ri=uniqNum(b.u.ri,c.u.ri),days=od===cd?[od]:[od,cd];
      const before=this.evalCost(ri,days,[b.u,c.u]);this.remove(b);this.remove(c);
      if(this.conflicts(b,cd,cs)!==0)return null;this.place(b,cd,cs);
      if(this.conflicts(c,od,os)!==0)return null;this.place(c,od,os);
      return this.evalCost(ri,days,[b.u,c.u])-before;}
    return null;}
  /* b'yi tek bir blokla çakışan yere koy, o bloğu boş yerlerinden rastgele birine taşı.
     Not: boş yerler tam taranır; rastgele örnekleme sıkışık okullarda çoğu zaman boşa gidip hamleyi işlevsizleştiriyor (ölçüldü). */
  mvKick(b){const D=this.D,P=this.P,fs=this.fsBuf||(this.fsBuf=new Int32Array(this.N));
    for(let t=0;t<10;t++){const d=(rand()*D)|0,s=(rand()*(P-b.len+1))|0;if(d===b.d&&s===b.s)continue;
      if(this.conflicts(b,d,s)!==1)continue;const x=this.hit[0];if(x.u===b.u)continue;
      const ri=uniqNum(b.u.ri,x.u.ri),before=this.evalCost(ri,this.allDays,[b.u,x.u]);
      this.remove(x);this.remove(b);this.place(b,d,s);
      let n=0;for(let dd=0;dd<D;dd++)for(let ss=0;ss+x.len<=P;ss++)if(this.conflicts(x,dd,ss)===0)fs[n++]=dd*P+ss;
      if(!n)return null;const pos=fs[(rand()*n)|0];this.place(x,(pos/P)|0,pos%P);
      return this.evalCost(ri,this.allDays,[b.u,x.u])-before;}
    return null;}
  hotBlocks(){const P=this.P,D=this.D,out=[];
    for(let r=0;r<this.NR;r++){const k=this.kindA[r];if(k===2)continue;const L=this.limA[r],oc=this.occA[r];
      for(let d=0;d<D;d++){const m=this.mask[r*D+d];if(!m)continue;const first=ctz(m),last=31-Math.clz32(m),n=popcnt(m),gaps=last-first+1-n;
        const bad=k===0?(gaps>0||first>this.foA[r][d]):((L.maxGaps>0&&gaps>L.maxGaps)||(L.minDay>0&&n<L.minDay)||gaps>1);
        if(bad)for(let p=first;p<=last;p++){const x=oc[d*P+p];if(x)out.push(x);}}
      if(k===1&&L.free){const c=this.cntA[r];let days=0;for(let d=0;d<D;d++)if(c[d]>0)days++;if(days===D)for(let i=0;i<this.N;i++)if(oc[i]&&(i%P===0||oc[i]!==oc[i-1]))out.push(oc[i]);}}
    return out;}
  async anneal(ms,stopped,onProg){
    if(ms<=30)return{it:0};
    const t0=now(),end=t0+ms,R=this.R,depth=Math.max(1,R.depth||3);if(this.blocks.some(b=>b.u.over===undefined))this.markOver();
    let cur=this.totalCost(),unp=this.unplacedHours();let best={u:unp,c:cur,s:this.snap()};
    const T0=Math.max(4,(R.tGap||1)*3),T1=.02;let T=T0,it=0,lastY=now(),hot=this.hotBlocks();
    while(true){
      it++;
      if((it&127)===0){const tn=now();if(tn>end||stopped())break;T=T0*Math.pow(T1/T0,(tn-t0)/ms);
        if(tn-lastY>30){lastY=tn;onProg&&onProg({cost:Math.round(best.c),left:best.u,it,frac:(tn-t0)/ms});await sleep0();}}
      if(it%400===0)hot=this.hotBlocks();
      /* yerleşmeyenleri ara ara yeniden dene; kapasitesi aşılmış (asla sığmayacak) dersleri atla */
      if(it%1500===0&&unp>0){let ch=false;for(const b of this.blocks){if(b.d>=0||b.u.over)continue;this.journal=[];if(this.tryInsert(b,depth,{n:100*depth}))ch=true;this.journal=null;}
        if(ch){cur=this.totalCost();unp=this.unplacedHours();if(unp<best.u||(unp===best.u&&cur<best.c))best={u:unp,c:cur,s:this.snap()};}}
      const b=hot.length&&rand()<.5?hot[(rand()*hot.length)|0]:this.blocks[(rand()*this.blocks.length)|0];
      if(!b||b.d<0||b.locked)continue;
      this.journal=[];const r=rand();
      const delta=r<.5?this.mvMove(b):r<.82?this.mvSwap(b):this.mvKick(b);
      if(delta===null){this.undoTo(0);this.journal=null;continue;}
      if(delta<=0||rand()<Math.exp(-delta/T)){cur+=delta;if(unp<best.u||(unp===best.u&&cur<best.c-1e-9))best={u:unp,c:cur,s:this.snap()};}
      else this.undoTo(0);
      this.journal=null;
    }
    if(unp>best.u||(unp===best.u&&cur>best.c+1e-9))this.restore(best.s);
    return{it};
  }
  /* --- raporlama --- */
  quality(){const q={cg:0,cs:0,tg:0,tgx:0,tmin:0,tfree:0,spread:0,pref:0},D=this.D;
    for(let r=0;r<this.NR;r++){const k=this.kindA[r];if(k===2)continue;const L=this.limA[r];let days=0;
      for(let d=0;d<D;d++){const st=this.statsOf(r,d);if(!st.n)continue;days++;
        if(k===0){q.cg+=st.gaps;if(st.first>this.foA[r][d])q.cs++;}
        else{q.tg+=st.gaps;if(L.maxGaps>0&&st.gaps>L.maxGaps)q.tgx++;if(L.minDay>0&&st.n<L.minDay)q.tmin++;}}
      if(k===1&&L.free&&days===D)q.tfree++;}
    for(const u of this.units.values()){const ds=u.blockObjs.filter(b=>b.d>=0).map(b=>b.d).sort((a,b)=>a-b);for(let i=1;i<ds.length;i++)if(ds[i]-ds[i-1]===1)q.spread++;
      if(u.pref)for(const b of u.blockObjs)if(b.d>=0)for(let p=b.s;p<b.s+b.len;p++)if(!this.prefOk(u.pref,p))q.pref++;}
    q.cost=Math.round(this.totalCost());return q;}
  capOf(k){const cl=this.closed.get(k),L=this.lim.get(k)||{},P=this.P,D=this.D;const per=[];for(let d=0;d<D;d++){let n=0;for(let p=0;p<P;p++)if(!cl[d*P+p])n++;if(L.maxDay)n=Math.min(n,L.maxDay);per.push(n);}
    if(L.maxDays&&L.maxDays<D)per.sort((a,b)=>b-a).length=L.maxDays;return per.reduce((a,b)=>a+b,0);}
  loadOfKey(k){let n=0;for(const u of this.units.values())if(u.resSet.has(k))n+=u.blocks.reduce((a,b)=>a+b,0);return n;}
}


/* ======================= ARAMA YÖNETİCİSİ ======================= */
async function runSearch(cfg,report,stopped,state=S){
  const idx=indexOf(state);
  const start=now(),deadline=start+cfg.timeMs;let best=null;const per=cfg.timeMs/Math.max(1,cfg.attempts);
  for(let a=0;a<cfg.attempts;a++){
    if(stopped()||now()>deadline-40)break;
    const aStart=now(),aEnd=Math.min(deadline,aStart+per);
    seedRand(((cfg.seed>>>0)||(Date.now()>>>0))+a*7919);   /* her çekirdek ve deneme farklı, ama tekrarlanabilir yol izler */
    const eng=new Engine({noSplits:cfg.mode==='fresh',state,idx});
    if(cfg.mode==='fresh')eng.clearUnlocked();
    if(cfg.mode!=='opt'){
      await eng.solve(aEnd,stopped,i=>report({ph:'Yerleştirme',a:a+1,left:i.left}));
      if(eng.R.split){const capBad=new Map();const overCap=k=>{if(!capBad.has(k))capBad.set(k,eng.loadOfKey(k)>eng.capOf(k));return capBad.get(k);};
        for(let round=0;round<3;round++){if(!eng.solveDone||stopped()||now()>aEnd-50)break;
          const un=eng.blocks.filter(b=>b.d<0&&b.len>1&&!b.locked&&!b.u.res.some(overCap));if(!un.length)break;
          un.forEach(b=>eng.splitBlock(b));await eng.solve(aEnd,stopped,i=>report({ph:'Bölünmüş bloklar',a:a+1,left:i.left}));}}
    }
    await eng.anneal(Math.max(0,aEnd-now()),stopped,i=>report({ph:'İyileştirme',a:a+1,left:i.left,cost:i.cost,frac:i.frac}));
    const sc=[eng.unplacedHours(),eng.totalCost()];
    if(!best||sc[0]<best.score[0]||(sc[0]===best.score[0]&&sc[1]<best.score[1]))best={score:sc,placements:eng.toPlacements(),splits:eng.splitsOut()};
    report({ph:'Deneme bitti',a:a+1,left:best.score[0],cost:Math.round(best.score[1])});
  }
  return best;
}

const SCHEMA_V=4;
const fnv=str=>{let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);}return(h>>>0).toString(16);};
const Persist={
  status:{ok:true,at:0,bytes:0,from:null,error:''},
  /* state JSON metni verilir; zarf: {v,at,sum,state} */
  write(json){
    const body=`{"v":${SCHEMA_V},"at":${Date.now()},"sum":"${fnv(json)}","state":${json}}`;
    try{
      localStorage.setItem(KEY+':tmp',body);
      const prev=localStorage.getItem(KEY);if(prev)localStorage.setItem(KEY+':prev',prev);
      localStorage.setItem(KEY,body);localStorage.removeItem(KEY+':tmp');
      this.status={...this.status,ok:true,at:Date.now(),bytes:body.length,error:''};return{ok:true};
    }catch(e){
      const error=e&&e.name==='QuotaExceededError'?'tarayıcı depolama alanı dolu':(e&&e.message)||'bilinmeyen hata';
      this.status={...this.status,ok:false,error};return{ok:false,error};
    }
  },
  /* asıl kayıt bozuksa önceki sağlam sürüme döner */
  read(){
    const tries=[[KEY,'asıl kayıt'],[KEY+':prev','önceki sürüm'],[KEY+':tmp','yarım kalmış kayıt']];const bad=[];
    for(const[k,label]of tries){let raw=null;try{raw=localStorage.getItem(k);}catch(e){return{state:null,from:null,bad,blocked:true};}
      if(!raw)continue;
      try{const o=JSON.parse(raw);
        if(o&&o.state&&o.sum){const js=JSON.stringify(o.state);if(fnv(js)!==o.sum){bad.push(label+' (sağlama tutmuyor)');continue;}return{state:o.state,from:label,bad,at:+o.at||0};}
        if(o&&o.settings)return{state:o,from:label+' (eski biçim)',bad};   // sağlamasız eski kayıt
        bad.push(label+' (tanınmayan biçim)');
      }catch(e){bad.push(label+' (okunamıyor)');}}
    return{state:null,from:null,bad};
  },
};

const Model={
  /* durumu doğrular, onarabildiğini onarır; onarılanların listesini döner */
  repair(s){
    const fix=[];if(!s||typeof s!=='object'||Array.isArray(s))throw new Error('Geçerli bir program verisi değil.');
    if(!s.settings||typeof s.settings!=='object')throw new Error('Okul ayarları bulunamadı; bu dosya bu uygulamaya ait değil gibi görünüyor.');
    s=migrate(s);const st=s.settings;
    if(!Array.isArray(st.days)||!st.days.length){st.days=DEFAULT().settings.days;fix.push('Gün listesi boştu, varsayılan günler kondu.');}
    const P=Math.round(+st.periods);if(!(P>=1&&P<=16)){st.periods=8;fix.push('Günlük ders sayısı geçersizdi, 8 yapıldı.');}else st.periods=P;
    if(!Array.isArray(st.dutyPlaces))st.dutyPlaces=[];
    const D=st.days.length;
    /* tekrar eden kimlikleri ayıkla */
    for(const[k,label]of[['subjects','ders'],['teachers','öğretmen'],['classes','sınıf'],['rooms','derslik'],['groups','seçmeli grup'],['acts','atama']]){
      const seen=new Set(),before=s[k].length;s[k]=s[k].filter(x=>x&&typeof x==='object'&&x.id&&!seen.has(x.id)&&seen.add(x.id));
      if(s[k].length<before)fix.push(`${before-s[k].length} geçersiz veya tekrar eden ${label} kaydı çıkarıldı.`);}
    const ids=k=>new Set(s[k].map(x=>x.id)),SU=ids('subjects'),T=ids('teachers'),C=ids('classes'),R=ids('rooms'),G=ids('groups');
    const okSlot=x=>{const[d,p]=String(x).split('-').map(Number);return d>=0&&d<D&&p>=0&&p<st.periods;};
    for(const o of[...s.teachers,...s.classes,...s.rooms,...s.subjects]){if(!Array.isArray(o.closed))o.closed=[];const n=o.closed.length;o.closed=o.closed.filter(okSlot);if(o.closed.length<n)fix.push(`${o.name||'?'}: gün/saat dışında kalan ${n-o.closed.length} kapalı saat silindi.`);if(typeof o.name!=='string')o.name=String(o.name??'?');}
    let dropped=0,fixedRefs=0;
    s.acts=s.acts.filter(a=>{
      if(!SU.has(a.subjectId)){dropped++;return false;}
      const c0=(a.classIds||[]).length,t0=(a.teacherIds||[]).length;
      a.classIds=[...new Set((a.classIds||[]).filter(x=>C.has(x)))];a.teacherIds=[...new Set((a.teacherIds||[]).filter(x=>T.has(x)))];
      if(a.classIds.length<c0||a.teacherIds.length<t0)fixedRefs++;
      if(a.roomId&&!R.has(a.roomId)){a.roomId='';fixedRefs++;}if(a.groupId&&!G.has(a.groupId)){a.groupId='';fixedRefs++;}
      const h=Math.round(+a.hours);if(!(h>=1&&h<=40)){a.hours=Math.max(1,Math.min(40,h||1));fixedRefs++;}else a.hours=h;
      if(!a.classIds.length){dropped++;return false;}return true;});
    if(dropped)fix.push(`Silinmiş ders veya sınıfa bağlı ${dropped} atama çıkarıldı.`);
    if(fixedRefs)fix.push(`${fixedRefs} atamada silinmiş öğretmen/derslik/grup bağlantısı temizlendi.`);
    const nPl=s.tt.placements.length;s.tt.placements=s.tt.placements.filter(p=>p&&typeof p.u==='string'&&[p.i,p.d,p.s,p.len].every(Number.isInteger));
    if(s.tt.placements.length<nPl)fix.push(`${nPl-s.tt.placements.length} bozuk yerleşim kaydı çıkarıldı.`);
    for(const[date,e]of Object.entries(s.dutyDays)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!e||!Array.isArray(e.a)){delete s.dutyDays[date];fix.push(`Bozuk nöbet günü (${date}) silindi.`);continue;}e.a=e.a.map(x=>T.has(x)?x:'');if(!e.lock||typeof e.lock!=='object')e.lock={};}
    for(const[date,l]of Object.entries(s.dutyRec)){if(!Array.isArray(l)){delete s.dutyRec[date];fix.push(`Bozuk nöbet kaydı (${date}) silindi.`);}}   /* kayıtlar ayrılan öğretmenler için adla kalır */
    return{state:s,fix};
  },
};

  /* kalıcı kurtarma noktaları: büyük/riskli işlemlerden önce */
  snaps(){try{return JSON.parse(localStorage.getItem(this.snapKey)||'[]');}catch(e){return[];}},
  snap(reason,json){if(!json)return;const l=this.snaps().filter(x=>x.json!==json);l.unshift({at:Date.now(),reason,json});
    while(l.length>this.maxSnaps)l.pop();

};

  if(r.bad.length)storageNotices.push(['warn',`Kayıt sorunu: ${r.bad.join(', ')}. ${r.state?`Veriler ${r.from} üzerinden kurtarıldı.`:'Kurtarılabilecek sağlam kayıt bulunamadı.'}`]);
  Persist.status.from=r.from;Persist.status.storedAt=r.at||0;
  if(!r.state){   /* bu tarayıcıda kayıt yok: dosyanın içine gömülü okul verisi varsa onunla aç */
    const emb=embeddedState();
    if(emb){try{const{state,fix}=Model.repair(emb.state);
      storageNotices.push(['info',`Dosyanın içindeki okul verisi yüklendi: ${state.settings.school}${emb.at?' ('+new Date(emb.at).toLocaleDateString('tr-TR')+' tarihli)':''}.`]);
      if(fix.length)storageNotices.push(['warn','Gömülü veri açılırken onarıldı: '+fix.join(' ')]);
      try{localStorage.setItem(KEY+':embedSeen',String(emb.at||0));}catch(e){}Persist.status.from='gömülü veri';return state;}   /* açılıştan sonra depoya yazılır */
      catch(e){storageNotices.push(['err','Dosyadaki gömülü veri okunamadı: '+e.message]);}}
    return DEFAULT();}
  try{const{state,fix}=Model.repair(r.state);if(fix.length)storageNotices.push(['warn','Veriler açılırken otomatik onarıldı: '+fix.join(' ')]);return state;}
  catch(e){storageNotices.push(['err','Kayıtlı veri okunamadı: '+e.message]);return DEFAULT();}
}

/* pencere: odak tuzağı, Esc ile kapanma (yalnızca en üstteki), dışarı tıklayınca kapanma; opts: {role, focus (seçici), onClose} */
function modal(html,mount,opts={}){const prev=document.activeElement;const m=document.createElement('div');m.className='modal';m.dataset.mod=tab;
  m.innerHTML=`<div class="box" role="${opts.role||'dialog'}" aria-modal="true">${html}</div>`;document.body.appendChild(m);
  const h=m.querySelector('h2');if(h){h.id='dlg-'+uid();m.firstElementChild.setAttribute('aria-labelledby',h.id);}
  let closed=false;const close=()=>{if(closed)return;closed=true;m.remove();document.removeEventListener('keydown',onKey);if(prev&&prev.focus)prev.focus();opts.onClose&&opts.onClose();};
  const isTop=()=>{const all=document.querySelectorAll('.modal');return all[all.length-1]===m;};
  const onKey=e=>{if(!isTop())return;if(e.key==='Escape')close();if(e.key==='Tab'){const f=[...m.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}};

/* yeniden çizimde (aynı sayfada kalındıysa) odak, imleç konumu, tablo ve sayfa kaydırması korunur:
   ör. bir sayı alanını değiştirip Tab'a basınca imleç bir sonraki alanda kalır */
const VIEW_KEYS=['id','data-ent','data-id','data-f','data-date','data-pi','data-dc','data-dw','data-r','data-op','data-v','data-lk','data-off','data-hol','data-per'];
function viewKey(el){if(!el||!el.getAttribute)return null;const parts=VIEW_KEYS.filter(k=>el.hasAttribute(k)).map(k=>`[${k}="${CSS.escape(el.getAttribute(k))}"]`);return parts.length?el.tagName.toLowerCase()+parts.join(''):null;}
function captureView(main){const a=document.activeElement,inMain=!!(a&&main.contains(a)&&a!==main);let sel=null;
  try{if(inMain&&typeof a.selectionStart==='number')sel=[a.selectionStart,a.selectionEnd];}catch(e){}
  return{tab:main.dataset.mod,key:inMain?viewKey(a):null,sel,y:window.scrollY,sx:[...main.querySelectorAll('.scroll')].map(x=>[x.scrollLeft,x.scrollTop])};}
function restoreView(main,v){if(!v||v.tab!==tab)return;
  const sc=main.querySelectorAll('.scroll');if(sc.length===v.sx.length)sc.forEach((x,i)=>{x.scrollLeft=v.sx[i][0];x.scrollTop=v.sx[i][1];});
  if(v.key){const el=main.querySelector(v.key);if(el){el.focus({preventScroll:true});if(v.sel)try{el.setSelectionRange(v.sel[0],v.sel[1]);}catch(e){}}}
  if(Math.abs(window.scrollY-v.y)>1)window.scrollTo(0,v.y);}

const ENT={sub:()=>M.sub,t:()=>M.t,c:()=>M.c,r:()=>M.r};
function fieldValue(el,f){if(el.type==='checkbox')return el.checked;if(el.type==='number'){if(f==='maxPeriods')return +el.value||0;return el.value===''?'':+el.value;}return el.value;}
$('#main').addEventListener('change',e=>{const el=e.target.closest('[data-ent][data-id][data-f]');if(!el)return;const o=ENT[el.dataset.ent]?.().get(el.dataset.id);if(!o)return;
  o[el.dataset.f]=fieldValue(el,el.dataset.f);commit(el.type==='number');});   /* sayı alanları kapasite/yük sütunlarını etkiler → yeniden çiz */
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-cl][data-ent]');if(!b)return;const o=ENT[b.dataset.ent]?.().get(b.dataset.cl);if(o)editClosed(o,o.name);});

/* ---------- Kapalı saat düzenleyici ---------- */
function editClosed(obj,title){
  const st=S.settings;const set=new Set(obj.closed||[]);
  const draw=()=>`<table class="grid cgrid"><thead><tr><th></th>${Array.from({length:st.periods},(_,p)=>`<th class="pointer" data-col="${p}">${p+1}</th>`).join('')}</tr></thead><tbody>${st.days.map((dn,d)=>`<tr><th class="pointer" data-row="${d}">${esc(dn)}</th>${Array.from({length:st.periods},(_,p)=>`<td data-k="${d}-${p}" class="${set.has(d+'-'+p)?'on':''}">${set.has(d+'-'+p)?'✕':''}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  modal(`<h2>${ic('lock')}${esc(title)} — kapalı saatler</h2><p class="muted small">Ders yerleştirilmesini istemediğiniz saatlere tıklayın. Gün adına tıklamak tüm günü, saat numarasına tıklamak o saati her gün açar/kapatır.</p><div id="cg" class="scroll"></div><div class="mt-14 row"><button class="btn p" id="ok">${ic('check')}Kaydet</button><button class="btn" id="clr">${ic('unlock')}Hepsini aç</button><button class="btn" id="cn">Vazgeç</button></div>`,(m,close)=>{
    const g=m.querySelector('#cg');const upd=()=>{g.innerHTML=draw();};upd();
    g.onclick=e=>{const td=e.target.closest('[data-k]'),rw=e.target.closest('[data-row]'),cl=e.target.closest('[data-col]');
      if(td){const k=td.dataset.k;set.has(k)?set.delete(k):set.add(k);}
      else if(rw){const d=+rw.dataset.row;const ks=Array.from({length:st.periods},(_,p)=>d+'-'+p);const all=ks.every(k=>set.has(k));ks.forEach(k=>all?set.delete(k):set.add(k));}
      else if(cl){const p=+cl.dataset.col;const ks=st.days.map((_,d)=>d+'-'+p);const all=ks.every(k=>set.has(k));ks.forEach(k=>all?set.delete(k):set.add(k));}
      upd();};
    m.querySelector('#clr').onclick=()=>{set.clear();upd();};
    m.querySelector('#cn').onclick=close;
    m.querySelector('#ok').onclick=()=>{obj.closed=[...set];close();commit();};
  });
}

const WORKER_TAIL=`let stopFlag=false;onmessage=async e=>{const m=e.data;if(m.type==='stop'){stopFlag=true;return;}if(m.type==='run'){try{const best=await runSearch(m.cfg,info=>postMessage({type:'prog',info}),()=>stopFlag,migrate(m.state));postMessage({type:'done',best});}catch(err){postMessage({type:'done',best:null,error:String(err&&err.message||err)});}}};`;
function makeWorker(){const src=document.getElementById('core').textContent+'\n'+WORKER_TAIL;const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));const w=new Worker(url);setTimeout(()=>URL.revokeObjectURL(url),5000);return w;}
async function runSolve(mode){
  if(running)return;
  if(mode!=='opt'&&!S.acts.length){toast('Program oluşturmak için önce ders ataması yapın.','warn',{label:'Ders Atamaları',fn:()=>go('atama')});return;}
  const errs=buildUnits(false).errors;if(errs.length&&!await ask(`Atamalarda ${errs.length} hata var; hatalı dersler yerleştirilmeyecek. Hataları "Ders Atamaları" sayfasında görebilirsiniz.`,{title:'Yine de devam edilsin mi?',ok:'Devam et'}))return;
  const R={...defaultRules(),...S.rules};
  const n=R.workers>0?R.workers:Math.max(1,Math.min(8,(navigator.hardwareConcurrency||4)-1));
  const timeMs=Math.max(2,(mode==='opt'?Math.max(5,R.timeSec/2):R.timeSec))*1000;
  const cfg={mode,timeMs,attempts:mode==='opt'?1:Math.max(1,R.attempts)};
  const state=JSON.parse(JSON.stringify(S));
  const status=[];let stopped=false;const ws=[];
  const ctl={stop(){stopped=true;ws.forEach(w=>{try{w.postMessage({type:'stop'});}catch(e){}});}};
  running=ctl;engCache=null;ui.sel=null;render();
  const t0=performance.now();
  const draw=()=>{const p=$('#prg');if(!p)return;const el=(performance.now()-t0)/1000,frac=Math.min(1,el*1000/timeMs);
    const bestLeft=Math.min(...status.filter(Boolean).map(s=>s.left??Infinity));const bestCost=Math.min(...status.filter(s=>s&&s.cost!=null).map(s=>s.cost));
    p.innerHTML=`<div class="jc-between mb-5 row small"><span>${ic('cpu')} ${ws.length||1} çekirdekte arama sürüyor… <b>${el.toFixed(0)} / ${(timeMs/1000).toFixed(0)} sn</b></span><span>En iyi: <b>${isFinite(bestLeft)?bestLeft:'–'}</b> saat yerleşmedi · ceza <b>${isFinite(bestCost)?bestCost:'–'}</b></span></div><div class="bar"><i style="width:${(frac*100).toFixed(1)}%"></i></div>
     <div class="wk">${status.map((s,i)=>s?`<div>${ic('cpu')} <b>Çekirdek ${i+1}</b> · deneme ${s.a}/${cfg.attempts}<br><span class="muted">${s.ph} · kalan ${s.left??'–'} saat${s.cost!=null?' · ceza '+s.cost:''}</span></div>`:'').join('')}</div>`;};
  const timer=setInterval(draw,250);
  let results=[];
  try{
    for(let i=0;i<n;i++){try{ws.push(makeWorker());}catch(e){break;}}
    if(ws.length){
      results=await Promise.all(ws.map((w,i)=>new Promise(res=>{let done=false;const fin=v=>{if(done)return;done=true;try{w.terminate();}catch(e){}res(v);};
        w.onmessage=e=>{const m=e.data;if(m.type==='prog')status[i]=m.info;else if(m.type==='done')fin(m.best);};
        w.onerror=ev=>{ev.preventDefault&&ev.preventDefault();fin(undefined);};
        setTimeout(()=>{if(!done){try{w.postMessage({type:'stop'});}catch(e){}setTimeout(()=>fin(null),4000);}},timeMs+3000);
        w.postMessage({type:'run',state,cfg:{...cfg,seed:((t0*1000)+i*104729)>>>0}});})));
    }
    if(!results.some(r=>r)&&!stopped){ // iş parçacığı açılamadıysa ana sayfada çalış
      ws.length=0;const best=await runSearch(cfg,info=>{status[0]=info;},()=>stopped);results=[best];
    }
  }finally{
    clearInterval(timer);
    let best=null;for(const r of results)if(r&&(!best||r.score[0]<best.score[0]||(r.score[0]===best.score[0]&&r.score[1]<best.score[1])))best=r;
    if(best){snapNext(mode==='opt'?'İyileştirme öncesi program':'Program oluşturma öncesi');S.tt.placements=best.placements;S.tt.splits=best.splits||{};}
    running=null;commit();
    {const failed=results.filter(r=>r===undefined).length;if(failed)toast(`${failed} çekirdek hata verdi; sonuç diğer çekirdeklerden alındı.`,'warn');}
    {const u0=getEngine().unplaced().length;toast(stopped?'Arama durduruldu; en iyi sonuç kaydedildi.':u0?`Program oluşturuldu, ${u0} blok yerleşmedi.`:'Program oluşturuldu: tüm dersler yerleşti.',stopped?'info':u0?'warn':'ok');}
    const e2=getEngine(),u=e2.unplaced().length,q=e2.quality();const p=$('#prg');
    if(p)p.innerHTML=(u?note('w',`<b>${u} blok yerleşmedi.</b> Açıklamalar aşağıda. Süreyi artırmak veya "En güçlü arama" hazır ayarını denemek sonucu iyileştirebilir.`):note('o',`<b>Tüm dersler yerleşti.</b> Sınıf penceresi: ${q.cg} · öğretmen boş saati: ${q.tg} · ceza puanı: ${q.cost}`))+`<span class="muted small">${ic('clock')} ${((performance.now()-t0)/1000).toFixed(1)} sn · ${ws.length||1} çekirdek · ${results.filter(Boolean).length} sonuç karşılaştırıldı${Object.keys(S.tt.splits).length?` · ${Object.keys(S.tt.splits).length} dersin bloğu bölündü`:''}</span>`;
  }
}

const MONTH_COLS=['#2563eb','#7c3aed','#16a34a','#65a30d','#ca8a04','#ea580c','#dc2626','#db2777','#0891b2','#c2410c','#9333ea','#0369a1'];

function teacherDayClosed(t,d){const set=new Set(t.closed||[]);for(let p=0;p<S.settings.periods;p++)if(!set.has(d+'-'+p))return false;return true;}
function teacherLessonDays(){const eng=S.tt.placements.length?getEngine():null;const P=S.settings.periods,D=S.settings.days.length,m=new Map();
  if(!eng)return null;for(const t of S.teachers){const oc=eng.occ.get('t:'+t.id);m.set(t.id,Array.from({length:D},(_,d)=>{if(!oc)return false;for(let p=0;p<P;p++)if(oc[d*P+p])return true;return false;}));}return m;}
const dutyPool=()=>S.teachers.filter(t=>!t.dutyExempt);
/* öğleden önce sayılan ders sayısı (0 = otomatik: ders saatlerinin yarısı, yukarı yuvarlanır) */
const noonSplit=()=>{const P=S.settings.periods,n=+S.dutyCfg.noonAfter||0;return n>0&&n<P?n:Math.ceil(P/2);};
/* öğretmen -> gün -> {am: öğleden önce dersi var mı, pm: öğleden sonra dersi var mı}; program yoksa null */
function teacherHalfDays(){const eng=S.tt.placements.length?getEngine():null;if(!eng)return null;const P=S.settings.periods,D=S.settings.days.length,h=noonSplit(),m=new Map();
  for(const t of S.teachers){const oc=eng.occ.get('t:'+t.id);m.set(t.id,Array.from({length:D},(_,d)=>{let am=false,pm=false;if(oc)for(let p=0;p<P;p++)if(oc[d*P+p]){if(p<h)am=true;else pm=true;}return{am,pm};}));}return m;}
/* öğretmen o gün nöbet tutamıyorsa nedeni, tutabiliyorsa '' */
/* kesin engel: izinli (kapalı) gün veya kişisel nöbet muaf günü; bunlar hiçbir koşulda esnetilmez */
const dutyHardBlock=(t,d)=>teacherDayClosed(t,d)||(t.dutyOffDays||[]).includes(d);
/* "eşitlik için esnet" açıkken yarım gün ve "sadece dersi olan gün" kuralları kesin olmaktan çıkar */
const dutyRelax=()=>!!S.dutyCfg.eqRelax&&!!(S.dutyCfg.halfDay||S.dutyCfg.onlyLesson);
const dutyAvail=(t,d,LD,HD)=>dutyRelax()?!dutyHardBlock(t,d):!dutyBlock(t,d,LD,HD);
function dutyBlock(t,d,LD,HD){const cfg=S.dutyCfg;
  if(teacherDayClosed(t,d))return'izinli';
  if((t.dutyOffDays||[]).includes(d))return'nöbet muaf günü';
  if(cfg.halfDay&&HD){const h=HD.get(t.id)?.[d];if(h&&(!h.am||!h.pm))return!h.am&&!h.pm?'dersi yok':!h.am?'öğleden önce boş':'öğleden sonra boş';}

  /* ---- C aşaması: kesin öncelikler kötüleşmeden ağırlıklı kuralları iyileştir ---- */

      for(const t of order){let bd=-1,bc=Infinity;for(const d of act[w]){if(!avail[t][d]||dayCount(w,d,-1)>=PL)continue;const old=apply([w],[[w*T+t,d]]);const c=costA()+Math.random()*.5;revert([w],[[w*T+t,d]],old);if(c<bc){bc=c;bd=d;}}
        if(bd>=0)apply([w],[[w*T+t,bd]]);}}

    let cur=costA();const T0=Math.max(5,W.tek),T1=.01;

    polishC();tunePhases();tekMoves+=await tekBalance(t0+CAP);polishC();
    const p=prim(),s=sec();if(!bestP||cmp(p,bestP)<0||(cmp(p,bestP)===0&&s<bestS-1e-9)){bestP=p;bestS=s;best=Int8Array.from(A);bestPh=Int8Array.from(sPh);bestPC=placeConf();}

  const tk=EL.map(t=>baseTek[t]+tekC[t]),info={tekMin:tk.length?Math.min(...tk):0,tekMax:tk.length?Math.max(...tk):0,tekDays:sK,bent:sV,placeConf:placeConf()};

/* Nöbet yerleri. KİLİTLİ HÜCRELERE ASLA DOKUNULMAZ; yalnızca kilitsiz yerler kendi aralarında yer değiştirir.

     1) her öğretmen dönemler boyunca her yerde eşit sayıda bulunur (en çok ile en az arası 1'i geçmez)
     2) yerler sırayla döner: bir nöbetinde 1. yerdeyse sonraki çift nöbetinde 2. yerde olur (önceki dönemin son yeri dahil);
        üç ve daha çok yerde sıra 1 → 2 → 3 → 1 diye ilerler
   Tek nöbetçi, kilitli değilse 1. yere yazılır. Yöntem: kilitsiz yerlerin takasıyla tavlama, ardından takas kalmayana kadar iyileştirme. */
function balancePlaces(weeks,hint){const PL=S.settings.dutyPlaces.length;if(PL<2)return 0;
  const base=placeCounts(weeks,PL),{prev,next}=placeSeeds(weeks,PL),cd=[];
  for(const wk of weeks)for(const x of wk.days){if(x.hol)continue;const e=S.dutyDays[x.date];if(!e)continue;
    const lock=e.lock||{},a=e.a.slice();while(a.length<PL)a.push('');e.a=a;
    const ids=a.slice(0,PL).filter(Boolean);
    if(ids.length===1){const k=a.findIndex((v,i)=>i<PL&&v);if(k>0&&!lock[k]&&!lock[0]){a[0]=a[k];a[k]='';}continue;}
    if(ids.length>=2)cd.push({a,lock,free:[...Array(PL).keys()].filter(i=>!lock[i])});}
  const mov=cd.filter(c=>c.free.length>=2&&c.free.some(i=>c.a[i]));if(!mov.length)return placeCost(cd,base,prev,next,PL);

    for(const d of cd){const movers=d.free.map(i=>d.a[i]).filter(Boolean);
      if(d.free.length>=2&&movers.length){let bp=null,bc=Infinity;
        const slotSets=d.free.length===movers.length?[d.free]:[d.free.slice(0,movers.length),...(d.free.includes(0)?[]:[]),d.free.slice(-movers.length)];
        for(const slots of slotSets)for(const pm of perms(movers).slice(0,720)){let c=0;
          pm.forEach((id,k)=>{const pi=slots[k],l=last.get(id),v=g(id);if(l===pi)c+=100;else if(l!=null&&PL>2&&pi!==(l+1)%PL)c+=10;
            let mn=1e9,mx=-1e9;v.forEach((n,q)=>{const z=n+(q===pi?1:0);if(z<mn)mn=z;if(z>mx)mx=z;});c+=(mx-mn>1?150*(mx-mn-1):0)+(mx-mn);});

/* yer maliyeti: 150 × (eşitlik farkının 1'i aşan kısmı) + 100 × (art arda aynı yer) + 10 × (sıra atlama, 3+ yerde) + çift günde boş 1. yer */
function placeCost(cd,base,prev,next,PL){const cnt=new Map(),last=new Map();let c=0;
  const g=id=>{let v=cnt.get(id);if(!v){v=(base.get(id)||Array(PL).fill(0)).slice();cnt.set(id,v);}return v;};
  for(const d of cd){if(!d.a[0]&&!d.lock[0])c+=5000;
    for(let pi=0;pi<PL;pi++){const id=d.a[pi];if(!id)continue;g(id)[pi]++;const l=last.has(id)?last.get(id):prev.get(id);
      if(l===pi)c+=100;else if(l!=null&&PL>2&&pi!==(l+1)%PL)c+=10;last.set(id,pi);}}
  for(const[id,l]of last){const n=next.get(id);if(n!=null&&n===l)c+=100;}
  for(const v of cnt.values()){let mn=1e9,mx=-1e9;for(const n of v){if(n<mn)mn=n;if(n>mx)mx=n;}c+=150*Math.max(0,mx-mn-1)+(mx-mn)*(mx-mn);}

function ledgerData(){const months=[...new Set(Object.keys(S.dutyRec).map(d=>d.slice(0,7)))].sort(),rows=new Map();

  dutyPool().forEach(t=>add(t.id));
  for(const[date,list]of Object.entries(S.dutyRec)){const k=kindOf(list.length),m=date.slice(0,7);for(const r of list){const row=add(r.tid,r.name);const o=row.m[m]||(row.m[m]={tek:0,cift:0});o[k]++;}}

let benchRunning=false;
function benchSchool(seed,{full=false,overRoom=false}={}){let x=seed;const rnd=()=>{x=(x*16807)%2147483647;return x/2147483647;};const s=DEFAULT();s.settings.school='Test';
  const subs=[['TDE',5],['MAT',6],['FİZ',2],['KİM',2],['BİY',2],['TAR',2],['COĞ',2],['DİN',2],['İNG',4],['ALM',2],['BED',2],['GÖR',2],['REH',1],['FEL',2],['BİL',full?4:2]];
  subs.forEach(([n],i)=>s.subjects.push({id:'s'+i,name:n,short:n,color:PAL[i%PAL.length],closed:[],pref:i===1?'sabah':''}));
  for(let i=0;i<24;i++)s.classes.push({id:'c'+i,name:(9+Math.floor(i/6))+'-'+'ABCDEF'[i%6],level:'Lise',maxPeriods:0,closed:[]});
  let tid=0;const need={};subs.forEach(([n,h],si)=>{const cnt=Math.ceil(h*24/22);need[si]=[];for(let k=0;k<cnt;k++){const id='t'+(tid++);
    s.teachers.push({id,name:n+' '+(k+1),short:n[0]+k,branch:n,maxDays:k===0&&si===2?4:'',maxDay:k===1&&si===0?6:'',closed:rnd()<0.4?Array.from({length:8},(_,p)=>Math.floor(rnd()*5)+'-'+p):[]});need[si].push({id,load:0});}});
  s.rooms.push({id:'spor',name:'Spor',closed:[]},{id:'spor2',name:'Spor 2',closed:[]},{id:'lab',name:'Lab',closed:[]},{id:'lab2',name:'Lab 2',closed:[]});
  for(let ci=0;ci<24;ci++)subs.forEach(([n,h],si)=>{const pool=need[si];pool.sort((a,b)=>a.load-b.load);pool[0].load+=h;const half=!overRoom&&ci>=12;
    s.acts.push({id:'a'+ci+'_'+si,subjectId:'s'+si,classIds:['c'+ci],teacherIds:[pool[0].id],roomId:n==='BED'?(half?'spor2':'spor'):n==='FİZ'?(half?'lab2':'lab'):'',hours:h,blocks:'',groupId:''});});
  return s;}

function verifyResult(e){const v=[],occ=new Map(),st=S.settings,P=st.periods,D=st.days.length;const add=m=>{if(v.length<50)v.push(m);};
  for(const b of e.blocks){if(b.d<0)continue;if(b.s<0||b.s+b.len>P||b.d>=D)add('Gün/saat dışına taşan blok');
    for(const a of b.u.acts){const rs=[...a.classIds.map(x=>'c'+x),...a.teacherIds.map(x=>'t'+x),...(a.roomId?['r'+a.roomId]:[])];
      for(let p=b.s;p<b.s+b.len;p++){for(const r of rs){const k=r+'@'+b.d+'-'+p,o=occ.get(k);if(o&&o!==b)add('Çakışma: '+k);occ.set(k,b);}
        if((M.sub.get(a.subjectId)?.closed||[]).includes(b.d+'-'+p))add('Dersin kapalı saati kullanılmış');}}}
  const busy=(pre,id,d,p)=>occ.has(pre+id+'@'+d+'-'+p);
  for(const t of S.teachers){for(const c of t.closed||[]){const[d,p]=c.split('-');if(busy('t',t.id,d,p))add(`${t.name}: kapalı saate ders`);}
    const per=Array(D).fill(0);for(let d=0;d<D;d++)for(let p=0;p<P;p++)if(busy('t',t.id,d,p))per[d]++;
    if(+t.maxDay>0&&per.some(n=>n>+t.maxDay))add(`${t.name}: günlük ders sınırı aşıldı`);if(+t.maxDays>0&&per.filter(Boolean).length>+t.maxDays)add(`${t.name}: haftalık gün sınırı aşıldı`);}
  for(const c of S.classes){for(const k of c.closed||[]){const[d,p]=k.split('-');if(busy('c',c.id,d,p))add(`${c.name}: kapalı saate ders`);}
    if(+c.maxPeriods>0)for(let d=0;d<D;d++)for(let p=+c.maxPeriods;p<P;p++)if(busy('c',c.id,d,p))add(`${c.name}: günlük ders sayısı aşıldı`);}
  for(const r of S.rooms)for(const k of r.closed||[]){const[d,p]=k.split('-');if(busy('r',r.id,d,p))add(`${r.name}: kapalı saatte kullanılmış`);}
  for(const u of e.units.values())if(u.blockObjs.length<=D){const ds=u.blockObjs.filter(b=>b.d>=0).map(b=>b.d);if(new Set(ds).size!==ds.length)add('Bir dersin iki bloğu aynı güne düşmüş');}
  return v;}
async function runEngineTests(ms,onRow){
  const keep=S,keepJson=lastJson,rows=[];benchRunning=true;
  try{for(const sc of BENCH){S=migrate(sc.make());reindex();seedRand(20261107);
      const e=new Engine({noSplits:true});e.clearUnlocked();const t0=now();const s1=await e.solve(t0+ms,()=>false);const tS=now()-t0;
      const t1=now();const a=await e.anneal(ms,()=>false);const tA=now()-t1;const q=e.quality(),viol=verifyResult(e);
      const row={ad:sc.ad,blok:e.blocks.length,yerlesmeyen:e.unplacedHours(),pencere:q.cg,ogrBos:q.tg,ceza:q.cost,solveMs:Math.round(tS),hamleSn:Math.round(a.it/(tA/1000)),ihlal:viol};
      rows.push(row);onRow&&onRow(rows);await sleep0();}}
  finally{S=keep;reindex();engCache=null;lastJson=keepJson;benchRunning=false;}
  return rows;}

  el.innerHTML=pageHead('db','Veri & Yedek','Yedekleme, Excel çıktıları, örnek veri')+`
  <div class="card"><h2>${ic('db')}Yedekleme ve taşıma</h2><p class="muted small">Verileriniz bu tarayıcıda otomatik saklanır. Güvence için düzenli yedek (.json) alın. Programı <b>başka bir bilgisayara taşımak</b> için "Verilerle birlikte indir" en kolay yoldur: tek bir dosya iner, açıldığında okul verisi hazır gelir.</p>
  <div class="row"><button class="btn p" id="exHtml">${ic('file')}Verilerle birlikte indir (.html)</button><button class="btn" id="ex">${ic('down')}Yedeği indir (.json)</button><label class="pointer btn">${ic('up')}Yedekten yükle<input class="hidden" type="file" id="im" accept=".json,application/json"></label></div></div>
  <div class="card"><h2>${ic('shield')}Kayıt durumu ve kurtarma noktaları</h2>
   ${(()=>{const st=Persist.status,snaps=History.snaps();const fmt=t=>new Date(t).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
     return`<div class="mb-12 stats">${stat(st.ok?'check':'alert',st.ok?'o':'e',st.ok?'Kaydediliyor':'Kaydedilemiyor','Otomatik kayıt'+(st.ok?'':': '+esc(st.error)))}${stat('db','i',(lastJson.length/1024).toFixed(1)+' KB','Veri boyutu (sınır ~5 MB)')}${stat('layers','a',History.undo.length,'Geri alınabilir adım (Ctrl+Z)')}${stat('clock','a',snaps.length,'Kurtarma noktası')}</div>
     <p class="mb-8x muted small">Ders programı oluşturma, yedek yükleme, toplu silme gibi işlemlerden hemen önce otomatik olarak kurtarma noktası alınır (son ${History.maxSnaps}). Bunlar yalnızca bu tarayıcıda durur; asıl güvence düzenli indirdiğiniz yedektir.</p>
     ${snaps.length?`<div class="scroll"><table class="t"><thead><tr><th>Zaman</th><th>Hangi işlemden önce</th><th>Boyut</th><th></th></tr></thead><tbody>${snaps.map((x,i)=>`<tr><td>${fmt(x.at)}</td><td>${esc(x.reason)}</td><td class="muted">${(x.json.length/1024).toFixed(1)} KB</td><td class="nowrap"><button class="btn sm" data-snap="${i}">${ic('wand')}Bu noktaya dön</button> <button class="btn sm ico" data-snapdl="${i}" title="Bu noktayı dosya olarak indir">${ic('down')}</button></td></tr>`).join('')}</tbody></table></div>`:emptyBox('clock','Henüz kurtarma noktası yok. Riskli bir işlem yaptığınızda burada otomatik oluşur.')}`;})()}</div>
  <div class="card"><details id="devT"><summary class="dev-summary"><span class="hi">${ic('cpu')}</span>Geliştirici: motor testleri</summary>
   <p class="my-10 muted small">Dağıtım motorunu 4 sabit senaryoda tek çekirdekte çalıştırır ve sonucu motordan bağımsız bir doğrulayıcıyla kesin kurallara karşı denetler (çakışma, kapalı saatler, günlük/haftalık sınırlar, aynı güne iki blok). Verilerinize dokunmaz. Motor değiştiğinde "Kural ihlali" sütununun 0 kalması gerekir.</p>
   <div class="row"><button class="btn p" id="devRun">${ic('zap')}Testleri çalıştır (~25 sn)</button><span class="muted small" id="devMsg"></span></div><div class="mt-12" id="devOut"></div></details></div>
  <div class="card"><h2>${ic('grid')}Excel'e aktar</h2><div class="row"><button class="btn" id="c1">${ic('down')}Sınıf çarşafı (.csv)</button><button class="btn" id="c2">${ic('down')}Öğretmen çarşafı (.csv)</button></div></div>
  <div class="card"><h2>${ic('spark')}Örnek ve sıfırlama</h2><p class="muted small">Örnek veri: 4 lise sınıfı, 18 öğretmen, ortak beden eğitimi, bir seçmeli grup ve laboratuvar/spor salonu. Mevcut verilerin yerine geçer.</p>
  <div class="row"><button class="btn" id="smp">${ic('spark')}Örnek veriyi yükle</button><button class="btn d" id="rs">${ic('trash')}Her şeyi sil</button></div></div>`;
  const stamp=()=>new Date().toISOString().slice(0,10);
  $('#devRun').onclick=async()=>{const b=$('#devRun');if(benchRunning)return;b.disabled=true;$('#devMsg').textContent='Çalışıyor…';$('#devOut').innerHTML=skelGrid(4,8);
    try{const rows=await runEngineTests(3000,r=>{const o=$('#devOut');if(o)o.innerHTML=benchTable(r);});const bad=rows.reduce((n,r)=>n+r.ihlal.length,0);
      $('#devMsg').innerHTML=bad?`<span class="err">${bad} kural ihlali bulundu!</span>`:'<span class="okc">Tüm senaryolarda kural ihlali yok.</span>';}
    catch(err){$('#devMsg').innerHTML=`<span class="err">Test hatası: ${esc(err.message)}</span>`;}finally{b.disabled=false;}};
  $$('[data-snap]').forEach(b=>b.onclick=async()=>{const x=History.snaps()[+b.dataset.snap];if(!x)return;
    if(!await ask(`Veriler "${x.reason}" anındaki hâline dönecek. Şu anki hâl de kurtarma noktası olarak saklanır ve Ctrl+Z ile geri alınabilir.`,{title:'Kurtarma noktasına dönülsün mü?',ok:'Bu noktaya dön'}))return;
    try{const{state,fix}=Model.repair(JSON.parse(x.json));History.snap('Kurtarma noktasına dönmeden önce',lastJson);History.push(lastJson);applyJson(JSON.stringify(state),'Kurtarma noktasına dönüldü.'+(fix.length?` (${fix.length} sorun onarıldı)`:''));}
    catch(err){toast('Bu kurtarma noktası okunamadı: '+esc(err.message),'err');}});
  $$('[data-snapdl]').forEach(b=>b.onclick=()=>{const x=History.snaps()[+b.dataset.snapdl];if(x)download(`kurtarma-noktasi-${new Date(x.at).toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`,x.json,'application/json');});
  $('#ex').onclick=()=>download(`ders-programi-yedek-${stamp()}.json`,JSON.stringify(S,null,1),'application/json');
  $('#exHtml').onclick=exportBundle;
  $('#im').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let raw;try{raw=JSON.parse(await f.text());}catch(err){throw new Error('Dosya JSON biçiminde değil.');}const{state:o,fix}=Model.repair(raw);
    if(!await ask(`"${o.settings.school}" yedeği (${o.classes.length} sınıf, ${o.teachers.length} öğretmen, ${o.acts.length} atama) mevcut verilerin yerine yüklenecek. Şu anki hâl kurtarma noktası olarak saklanır.`,{title:'Yedek yüklensin mi?',ok:'Yedeği yükle'}))return;
    snapNext('Yedek yüklenmeden önce');S=o;ui={view:'c',ent:null,sel:null,filter:''};commit();
    if(fix.length)toast(`Yedek yüklendi; <b>${fix.length} sorun otomatik onarıldı.</b>`,'warn',{label:'Ayrıntılar',fn:()=>modal(`<h2>${ic('wand')}Onarılanlar</h2><ul>${fix.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><div class="row"><button class="btn p" id="okf">Tamam</button></div>`,(m,c)=>m.querySelector('#okf').onclick=c)});else toast(`Yedek yüklendi: ${esc(S.settings.school)}`);}catch(err){toast('Dosya okunamadı: '+esc(err.message),'err');}};
  $('#c1').onclick=()=>download(`sinif-carsaf-${stamp()}.csv`,csvMaster('c'),'text/csv');
  $('#c2').onclick=()=>download(`ogretmen-carsaf-${stamp()}.csv`,csvMaster('t'),'text/csv');
  $('#smp').onclick=async()=>{if(S.acts.length&&!await ask('Mevcut verilerin yerine örnek okul yüklenecek. Şu anki hâl kurtarma noktası olarak saklanır.',{title:'Örnek veri yüklensin mi?',ok:'Örnek veriyi yükle'}))return;snapNext('Örnek veri yüklenmeden önce');S=sample();ui={view:'c',ent:null,sel:null,filter:''};commit();toast('Örnek veri yüklendi.','info');};
  $('#rs').onclick=async()=>{if(!await ask('Tüm okul verileri silinecek. Öncesi kurtarma noktası olarak saklanır, yine de önce yedek indirmeniz önerilir.',{title:'TÜM veriler silinsin mi?',ok:'Her şeyi sil',danger:true}))return;snapNext('Tüm veriler silinmeden önce');S=DEFAULT();ui={view:'c',ent:null,sel:null,filter:''};commit();};
}
function sample(){
  const s=DEFAULT();s.settings.school='Örnek Anadolu Lisesi';s.settings.year='2026-2027';
  const sub=(name,short,pref)=>{const o={id:uid(),name,short,color:PAL[s.subjects.length%PAL.length],pref:pref||'',closed:[]};s.subjects.push(o);return o.id;};
  const B={TDE:sub('Türk Dili ve Edebiyatı','TDE'),MAT:sub('Matematik','MAT','sabah'),FIZ:sub('Fizik','FİZ'),KIM:sub('Kimya','KİM'),BIY:sub('Biyoloji','BİY'),TAR:sub('Tarih','TAR'),COG:sub('Coğrafya','COĞ'),DIN:sub('Din Kültürü ve Ahlak Bilgisi','DİN'),ING:sub('İngilizce','İNG'),ALM:sub('Almanca','ALM'),BED:sub('Beden Eğitimi ve Spor','BED','ilkdegil'),GOR:sub('Görsel Sanatlar','GÖR'),REH:sub('Rehberlik','REH'),PSI:sub('Psikoloji','PSİ'),BIL:sub('Bilgisayar Bilimi','BİL')};
  const t=(name,branch,closedDay)=>{const o={id:uid(),name,short:initials(name),branch,dutyExempt:false,closed:closedDay!=null?Array.from({length:8},(_,p)=>closedDay+'-'+p):[]};s.teachers.push(o);return o.id;};
  const T={ED1:t('Ayşe Kaya','Edebiyat'),ED2:t('Mehmet Demir','Edebiyat'),MA1:t('Zeynep Çelik','Matematik',4),MA2:t('Ali Şahin','Matematik'),FI:t('Emre Yıldız','Fizik'),KI:t('Elif Aydın','Kimya'),BI:t('Burak Öztürk','Biyoloji',0),TA:t('Fatma Arslan','Tarih'),CO:t('Hasan Koç','Coğrafya'),DI:t('Murat Kurt','Din Kültürü'),IN1:t('Selin Aksoy','İngilizce'),IN2:t('Deniz Polat','İngilizce'),AL:t('Canan Erdem','Almanca'),BE:t('Okan Taş','Beden Eğitimi'),BK:t('Gül Yavuz','Beden Eğitimi'),GO:t('Esra Güneş','Görsel Sanatlar'),PS:t('Kerem Uçar','Psikoloji'),BL:t('Seda Kılıç','Bilişim')};
  s.teachers.find(x=>x.id===T.DI).dutyExempt=true;
  const c=n=>{const o={id:uid(),name:n,level:'Lise',maxPeriods:0,closed:[]};s.classes.push(o);return o.id;};
  const C={A9:c('9-A'),B9:c('9-B'),A10:c('10-A'),B10:c('10-B')};
  const r=n=>{const o={id:uid(),name:n,closed:[]};s.rooms.push(o);return o.id;};
  const R={SP:r('Spor Salonu'),FL:r('Fizik Laboratuvarı'),BT:r('BT Sınıfı')};
  const g={id:uid(),name:'10. Sınıf Seçmeli-1'};s.groups.push(g);
  const a=(su,cls,tch,h,room,grp,bl)=>s.acts.push({id:uid(),subjectId:su,classIds:cls,teacherIds:tch,roomId:room||'',hours:h,blocks:bl||'',groupId:grp||''});
  [[C.A9,T.IN1,T.ED1],[C.B9,T.IN1,T.MA1]].forEach(([cl,ing,rh])=>{a(B.TDE,[cl],[T.ED1],5);a(B.MAT,[cl],[T.MA1],6);a(B.FIZ,[cl],[T.FI],2,R.FL);a(B.KIM,[cl],[T.KI],2);a(B.BIY,[cl],[T.BI],2);a(B.TAR,[cl],[T.TA],2);a(B.COG,[cl],[T.CO],2);a(B.DIN,[cl],[T.DI],2);a(B.ING,[cl],[ing],4);a(B.ALM,[cl],[T.AL],2);a(B.GOR,[cl],[T.GO],2);a(B.REH,[cl],[rh],1);});
  [[C.A10,T.ED2],[C.B10,T.MA2]].forEach(([cl,rh])=>{a(B.TDE,[cl],[T.ED2],5);a(B.MAT,[cl],[T.MA2],6);a(B.FIZ,[cl],[T.FI],2,R.FL);a(B.KIM,[cl],[T.KI],2);a(B.BIY,[cl],[T.BI],2);a(B.TAR,[cl],[T.TA],2);a(B.COG,[cl],[T.CO],2);a(B.DIN,[cl],[T.DI],2);a(B.ING,[cl],[T.IN2],4);a(B.ALM,[cl],[T.AL],2);a(B.REH,[cl],[rh],1);});
  a(B.BED,[C.A9,C.B9],[T.BE,T.BK],2,R.SP);a(B.BED,[C.A10,C.B10],[T.BE,T.BK],2,R.SP);
  a(B.PSI,[C.A10,C.B10],[T.PS],2,'',g.id);a(B.BIL,[C.A10,C.B10],[T.BL],2,R.BT,g.id);
  return s;
}
render();updateHistoryButtons();
if(Persist.status.from&&Persist.status.from!=='asıl kayıt')Persist.write(lastJson);   /* eski biçim / kurtarılan kayıt → güncel biçimde yeniden yaz */
for(const[k,m]of storageNotices)toast(esc(m),k==='err'?'err':k==='info'?'info':'warn',k==='err'?{label:'Yedek indir',fn:backupDownload,sticky:true}:{label:'Anladım',fn:()=>{},sticky:true});
/* tarayıcıda kayıt varken açılan dosyada farklı bir gömülü veri varsa bir kez sor */
{const emb=embeddedState();let seen='';try{seen=localStorage.getItem(KEY+':embedSeen')||'';}catch(e){}
 if(emb&&Persist.status.from&&String(emb.at||0)!==seen){
  const loadEmb=()=>{try{const{state}=Model.repair(emb.state);History.snap('Gömülü veri yüklenmeden önce',lastJson);History.push(lastJson);applyJson(JSON.stringify(state),'Dosyadaki gömülü veri yüklendi. Önceki hâl "Veri & Yedek" sayfasındaki kurtarma noktalarında.');}catch(e){toast('Gömülü veri okunamadı: '+esc(e.message),'err');}};
  const fmt=t=>new Date(t).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const older=Persist.status.storedAt&&emb.at&&emb.at<Persist.status.storedAt;
  if(older)toast(`Bu dosyanın içinde <b>daha eski</b> bir okul verisi var (${fmt(emb.at)}). Bu tarayıcıdaki verileriniz daha yeni (${fmt(Persist.status.storedAt)}) ve şu an açık. Dosyadakini yüklerseniz devirler, nöbet kayıtları ve çizelgeler o tarihteki hâline döner; <b>yüklemeyin</b>.`,'warn',
   [{label:'Kayıtlı verimle devam et',sticky:true,fn:()=>{}},{label:'Yine de dosyadakini yükle',fn:loadEmb}]);
  else toast(`Bu dosyanın içinde gömülü okul verisi var (<b>${esc(emb.state.settings.school||'?')}</b>${emb.at?', '+fmt(emb.at):''}). Şu an bu tarayıcıda kayıtlı veriler açık.`,'info',
   [{label:'Kayıtlı veriyle devam',sticky:true,fn:()=>{}},{label:'Dosyadaki veriyi yükle',fn:loadEmb}]);
  try{localStorage.setItem(KEY+':embedSeen',String(emb.at||0));}catch(e){}}}
</script>
