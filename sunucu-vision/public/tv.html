<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Okul Dijital Pano — TV</title>
<!--
  TV SÜRÜMÜ (Opera TV 40 / Chromium 53 ve benzeri eski TV tarayıcıları için)
  Kurallar: yalnızca ES5 JavaScript, CSS Grid/clamp()/backdrop-filter/gap/inset YOK,
  sabit 1920x1080 sahne + ölçekleme, düz renkler, hafif animasyon.
-->
<style>
  @font-face{font-family:"InterTV";font-style:normal;font-weight:600;src:url(/fonts/inter-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:"InterTV";font-style:normal;font-weight:600;src:url(/fonts/inter-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:"InterTV";font-style:normal;font-weight:700;src:url(/fonts/inter-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:"InterTV";font-style:normal;font-weight:700;src:url(/fonts/inter-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:"InterTV";font-style:normal;font-weight:800;src:url(/fonts/inter-latin-ext-800-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:"InterTV";font-style:normal;font-weight:800;src:url(/fonts/inter-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

  :root{
    --bg0:#070b14; --panel:#121a2c; --panel2:#1a2438; --line:#2a3550;
    --t0:#f4f7fc; --t1:#c3cce0; --t2:#8a96b2; --accent:#f2a93b; --hero:#ffb84d;
    --c-duty:#0f8f83; --c-sched:#c97815; --c-weather:#2f5fc0; --c-module:#7a3fc9; --c-menu:#c43569; --c-ticker:#d1601f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);}
  body{font-family:"InterTV","Segoe UI",Arial,Helvetica,sans-serif;color:var(--t0);}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg0);
    -webkit-transform-origin:0 0;transform-origin:0 0;}
  .ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.15em;}
  .abs{position:absolute;}

  /* ---------- Başlık ---------- */
  #top{left:20px;top:20px;width:1880px;height:110px;background:var(--panel);border:2px solid var(--line);border-radius:24px;}
  #logo{position:absolute;left:22px;top:15px;width:76px;height:76px;border-radius:18px;background:var(--panel2);color:var(--accent);
    font-size:46px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #logo img{width:100%;height:100%;object-fit:contain;}
  #bname{position:absolute;left:116px;top:12px;width:900px;font-size:46px;font-weight:800;line-height:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #bsub{position:absolute;left:116px;top:66px;width:900px;font-size:25px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Geri sayım açıkken ad/alt başlık kutunun başladığı yerde biter (eskiden 900px genişlik geri sayımın altına giriyordu) */
  #top.cdon #bname,#top.cdon #bsub{width:796px;}
  #cd{position:absolute;left:930px;top:12px;width:520px;height:82px;border-radius:41px;background:var(--panel2);border:2px solid var(--line);display:none;}
  #cd.on{display:block;}
  #cdIcon{position:absolute;left:26px;top:20px;font-size:40px;color:var(--accent);}
  #cdLabel{position:absolute;left:82px;top:7px;width:420px;font-size:21px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;}
  #cdVal{position:absolute;left:82px;top:30px;width:430px;font-size:38px;font-weight:800;line-height:44px;color:var(--t0);white-space:nowrap;overflow:hidden;}
  #cdVal small{font-size:22px;font-weight:700;color:var(--t1);}
  #clock{position:absolute;right:32px;top:6px;width:420px;text-align:right;font-size:72px;font-weight:800;line-height:80px;color:var(--accent);font-variant-numeric:tabular-nums;}
  #date{position:absolute;right:34px;top:78px;width:520px;text-align:right;font-size:25px;font-weight:600;color:var(--t1);white-space:nowrap;}

  /* ---------- Paneller ---------- */
  .panel{position:absolute;background:var(--panel);border:2px solid var(--line);border-radius:24px;overflow:hidden;}
  .ph{position:absolute;left:0;top:0;right:0;height:62px;color:#fff;font-size:30px;font-weight:800;line-height:62px;padding-left:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px;}
  .ph .ic{font-size:32px;margin-right:10px;vertical-align:-0.2em;}
  .ph .sub{position:absolute;right:20px;top:0;font-size:18px;font-weight:600;opacity:.9;}

  /* Ders programı */
  #sched{left:20px;top:150px;width:560px;height:810px;}
  #sched .ph{background:var(--c-sched);}
  #hero{position:absolute;left:0;top:62px;right:0;height:134px;padding:14px 22px 0 22px;}
  #heroLabel{position:absolute;left:22px;top:20px;width:290px;font-size:25px;font-weight:700;color:var(--t1);line-height:30px;}
  #heroTime{position:absolute;right:22px;top:6px;width:240px;text-align:right;font-size:66px;font-weight:800;line-height:76px;color:var(--hero);font-variant-numeric:tabular-nums;}
  #heroTime.long{font-size:48px;} /* SS:DD:ss (1 saatten uzun) 240px kutuya sığsın; eskiden son rakam kırpılıyordu */
  #barBg{position:absolute;left:22px;right:22px;top:96px;height:16px;border-radius:8px;background:var(--panel2);overflow:hidden;}
  #barFill{height:100%;width:0%;background:var(--hero);border-radius:8px;}
  #sList{position:absolute;left:14px;right:14px;top:202px;bottom:10px;overflow:hidden;}
  .si{position:relative;margin-bottom:3px;border-radius:12px;display:flex;align-items:center;color:#fff;overflow:hidden;}
  .si .nm{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:16px;}
  .si .tm{flex:none;font-weight:700;padding-right:14px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .si.cls{background:#2557d6;border-left:10px solid #8fb2ff;}
  .si.brk{background:#168a43;border-left:10px solid #8ff0b2;}
  .si.past{opacity:.72;} /* geçmiş ders: soluk ama koridordan okunur (eskiden .45 -> 2.1:1; şimdi >=3:1) */
  .si.now{background:#ffb020;border-left:10px solid #fff;color:#1b1300;box-shadow:0 0 0 4px #fff;}
  .si .nowb{flex:none;background:#1b1300;color:#ffb020;font-weight:800;border-radius:14px;padding:2px 12px;margin-right:10px;font-size:20px;}

  /* Medya */
  #media{position:absolute;left:600px;top:150px;width:780px;height:439px;background:#000;border:2px solid var(--line);border-radius:24px;overflow:hidden;}
  .sl{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;-webkit-transition:opacity .8s ease;transition:opacity .8s ease;}
  .sl.on{opacity:1;}
  .sl img,.sl video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#000;}
  /* Görsel her zaman tamamı görünecek şekilde sığar; siyah bant yerine aynı görselin bulanık, koyu kopyası kenarları doldurur.
     Oran alanla uyuşuyorsa kopya eklenmez (eski TV belleği için). Bulanıklık bir kez çizilir, geçiş yalnızca opaklıkla yapılır. */
  .sl img.fit{background:transparent;}
  .sl img.bg{left:-5%;top:-5%;width:110%;height:110%;object-fit:cover;background:#000;-webkit-filter:blur(22px) brightness(.5);filter:blur(22px) brightness(.5);}
  #mEmpty{position:absolute;left:0;top:0;right:0;bottom:0;background:var(--panel);display:none;flex-direction:column;align-items:center;justify-content:center;color:var(--t2);text-align:center;padding:0 60px;}
  #mEmpty .ic{font-size:96px;margin-bottom:16px;}
  #mEmpty div{font-size:28px;font-weight:600;line-height:36px;}
  #mErr{position:absolute;left:0;right:0;top:0;background:rgba(0,0,0,.82);color:#ffd9a0;font-size:22px;font-weight:700;line-height:30px;padding:10px 18px;display:none;z-index:5;}
  #mCap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);color:#fff;font-size:28px;font-weight:700;line-height:36px;padding:10px 22px;display:none;z-index:3;}

  /* Nöbetçi */
  #duty{left:600px;top:609px;width:780px;height:351px;}
  #duty .ph{background:var(--c-duty);}
  #dList{position:absolute;left:18px;right:18px;top:72px;bottom:8px;overflow:hidden;}
  .dr{display:flex;align-items:center;border-bottom:2px solid var(--line);}
  .dr:last-child{border-bottom:none;}
  .dr .tag{flex:none;width:210px;text-align:center;background:var(--tag-duty);color:#fff;font-weight:800;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr .dn{flex:1;min-width:0;margin-left:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Menü */
  #menu{left:1400px;top:150px;width:500px;height:340px;}
  #menu .ph{background:var(--c-menu);}
  #mList{position:absolute;left:18px;right:18px;top:70px;bottom:8px;overflow:hidden;}
  .mr{display:flex;align-items:center;border-bottom:2px solid var(--line);}
  .mr:last-child{border-bottom:none;}
  .mr .day{flex:none;width:134px;text-align:center;background:var(--panel2);color:var(--t1);font-weight:800;border-radius:999px;white-space:nowrap;}
  .mr .it{flex:1;min-width:0;margin-left:14px;font-weight:600;color:var(--t1);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .mr.today .day{background:var(--c-menu);color:#fff;}
  .mr.today .it{color:var(--t0);font-weight:700;}
  /* Onur Köşesi (yemek menüsü yerine yayınlanabilir) */
  .hn{border-bottom:2px solid var(--line);padding:4px 4px 2px;overflow:hidden;}
  .hn:last-child{border-bottom:none;}
  .hn .hl{display:inline-block;max-width:100%;background:var(--c-menu);color:#fff;font-weight:800;font-size:19px;line-height:26px;padding:0 14px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hn .hnm{font-weight:800;color:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .hn .hs{font-weight:600;color:var(--t1);font-size:18px;line-height:22px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .hnone{color:var(--t2);font-weight:600;font-size:22px;line-height:30px;padding:14px 6px;}

  /* Hava durumu */
  #wx{left:1400px;top:510px;width:500px;height:192px;}
  #wx .ph{background:var(--c-weather);height:54px;line-height:54px;font-size:28px;}
  #wxIcon{position:absolute;left:20px;top:70px;font-size:96px;color:#8fc0ff;}
  #wxTemp{position:absolute;left:140px;top:62px;width:170px;font-size:84px;font-weight:800;line-height:100px;color:var(--t0);}
  #wxCond{position:absolute;left:312px;top:70px;width:180px;font-size:25px;font-weight:700;line-height:30px;color:var(--t0);}
  #wxFeels{position:absolute;left:312px;top:114px;width:180px;font-size:21px;font-weight:600;color:var(--t1);}
  #wxMM{position:absolute;left:312px;top:144px;width:180px;font-size:21px;font-weight:600;color:var(--t1);}

  /* Bilgilendirme */
  #info{left:1400px;top:722px;width:500px;height:238px;}
  #info .ph{background:var(--c-module);height:54px;line-height:54px;font-size:28px;}
  #infoText{position:absolute;left:22px;right:22px;top:66px;bottom:10px;font-size:27px;line-height:35px;font-weight:600;color:var(--t0);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;}

  /* Duyuru şeridi */
  #tick{left:20px;top:980px;width:1880px;height:80px;background:var(--panel);border:2px solid var(--line);border-radius:24px;overflow:hidden;}
  #tkTag{position:absolute;left:12px;top:10px;width:196px;height:56px;border-radius:28px;background:var(--c-ticker);color:#fff;font-size:28px;font-weight:800;line-height:56px;text-align:center;}
  #tkTag .ic{font-size:30px;margin-right:8px;}
  #tkText{position:absolute;left:228px;top:0;width:1630px;height:76px;overflow:hidden;}
  #tkMove{position:absolute;left:0;top:0;height:76px;line-height:76px;font-size:38px;font-weight:700;white-space:nowrap;color:var(--t0);-webkit-will-change:transform;will-change:transform;}
  #net{position:absolute;right:20px;top:0;height:76px;line-height:76px;font-size:20px;font-weight:700;color:#ffb020;display:none;background:var(--panel);padding-left:12px;}
/* ===== Acil duyuru ve uyku ekranı ===== */
#sleep{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;z-index:150;display:none;}
#emg{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:200;display:none;overflow:hidden;color:#fff;background:var(--e2);font-family:"InterTV","Segoe UI",Arial,sans-serif;}
#emg.red{--e1:#e0242c;--e2:#8a0d13;} #emg.orange{--e1:#f08a14;--e2:#9a4d00;} #emg.blue{--e1:#2f6fe0;--e2:#143a85;} #emg.green{--e1:#1fa35a;--e2:#0d5c31;} #emg.yellow{--e1:#f2c014;--e2:#8a6a00;color:#1b1300;}
#emgPulse{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--e1);opacity:.0;-webkit-animation:emgp 1.6s ease-in-out infinite;animation:emgp 1.6s ease-in-out infinite;}
@-webkit-keyframes emgp{0%{opacity:.0}50%{opacity:.55}100%{opacity:.0}} @keyframes emgp{0%{opacity:.0}50%{opacity:.55}100%{opacity:.0}}
#emgBox{position:absolute;left:90px;right:90px;top:90px;bottom:90px;border:10px solid rgba(255,255,255,.9);border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 60px;}
#emg.yellow #emgBox{border-color:rgba(27,19,0,.9);}
#emgIc{font-size:210px;line-height:1;margin-bottom:10px;} #emgIc .ic{width:1em;height:1em;stroke-width:1.4;}
#emgTitle{font-weight:800;font-size:120px;line-height:132px;text-transform:uppercase;letter-spacing:2px;max-width:1600px;}
#emgText{font-weight:700;font-size:64px;line-height:80px;margin-top:26px;max-width:1560px;white-space:pre-line;}
#emgTime{position:absolute;right:50px;bottom:34px;font-size:34px;font-weight:700;opacity:.85;}
/* ===== Ek temalar (düzen değiştiren) =====
@font-face{font-family:"Grotesk";font-weight:700;src:url(/fonts/space-grotesk-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Grotesk";font-weight:700;src:url(/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Nunito";font-weight:800;src:url(/fonts/nunito-latin-ext-800-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Nunito";font-weight:800;src:url(/fonts/nunito-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Chalk";font-weight:700;src:url(/fonts/caveat-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Chalk";font-weight:700;src:url(/fonts/caveat-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122}
/* tema: ormandogal */
body.th-ormandogal{--bg0:#0e2a1e!important;--panel:#f6f0df!important;--panel2:#e9e0c6!important;--line:#d6c9a6!important;--t0:#1d2a1f!important;--t1:#44543f!important;--t2:#6f7c64!important;--accent:#c9971c!important;--hero:#b45309!important;
--c-duty:#8a6a14!important;--c-sched:#2f6b3f!important;--c-weather:#2b6a7a!important;--c-module:#6b4f9a!important;--c-menu:#a23b3b!important;--c-ticker:#b45309!important;}
body.th-ormandogal #stage{background:linear-gradient(180deg,#0e2a1e,#143a29)!important;}
body.th-ormandogal #top,body.th-ormandogal #tick{color:#f7f1de!important;--panel:#153d2c;--panel2:#1f5a41;--line:#2d7a58;--t0:#f7f1de;--t1:#d3dcc6;--t2:#a9b99d;background:#153d2c!important;border:2px solid #2d7a58!important;}
body.th-ormandogal #top #clock{color:#f2c14e!important}
body.th-ormandogal #top #cdIcon{color:#f2c14e!important}
body.th-ormandogal .panel,body.th-ormandogal #top,body.th-ormandogal #tick{border-radius:26px!important;}
body.th-ormandogal .panel{border:2px solid #d6c9a6!important;}
body.th-ormandogal .si.cls{background:#dfe9d6!important;border-left:10px solid #2f6b3f!important;color:#183a22!important}
body.th-ormandogal .si.brk{background:#f3e3b5!important;border-left:10px solid #b9892b!important;color:#5a3e05!important}
body.th-ormandogal .si.now{background:#2f6b3f!important;border-left:10px solid #f2c14e!important;color:#fff!important;box-shadow:0 0 0 4px #f2c14e!important}
body.th-ormandogal .si .nowb{background:#f2c14e!important;color:#183a22!important}
body.th-ormandogal .si.past{opacity:.68!important}
body.th-ormandogal #wxIcon{color:#2b6a7a!important}
body.th-ormandogal #barBg{background:#e0d6b8!important}
body.th-ormandogal #tkTag{background:#c9971c!important;color:#1a1200!important}
/* tema: yanserit */
body.th-yanserit #top{left:0!important;top:0!important;width:1920px!important;height:1080px!important;border:0!important;pointer-events:none;z-index:6;border-radius:0!important}
body.th-yanserit{--bg0:#e9edf4!important;--panel:#ffffff!important;--panel2:#e8edf6!important;--line:#d2d9e6!important;--t0:#0f1a2b!important;--t1:#3a4960!important;--t2:#6b7a93!important;--accent:#ffb703!important;--hero:#e8590c!important;
--c-duty:#0b8f7a!important;--c-sched:#e8590c!important;--c-weather:#8fb2ff!important;--c-module:#ffb703!important;--c-menu:#c2255c!important;--c-ticker:#ffb703!important;}

    mLayer = mLayer ? 0 : 1;
    setTimeout(reveal, 4000); /* yüklenemese bile 4 sn sonra geçiş yapılır; pano takılı kalmaz */
    if(hold > 0) mTimer = setTimeout(nextSlide, hold);
  }

  /* ================= Sunucu ile senkron ================= */
  var fails = 0;
  /* Hata sınırı: bir bölümdeki beklenmedik hata diğer bölümlerin çizimini durdurmasın */
  function safe(fn){ try{ fn(); }catch(e){ noteError("render", e); } }
  function renderAll(){
    safe(renderBrand); safe(renderDuty); safe(renderScheduleList); safe(renderWeather); safe(renderModule); safe(renderMenu); safe(renderTicker);
  }
  /* Yenileme yalnızca sunucu erişilebiliyorsa yapılır; çevrimdışıyken yenilersek TV hata sayfasında takılı kalabilir */
  var lastOkAt = Date.now(), errTimes = [];
  function canReload(){ return Date.now() - lastOkAt < 120000; }
  function noteError(where, e){
    var now = Date.now(); errTimes.push(now);
    while(errTimes.length && now - errTimes[0] > 60000) errTimes.shift();
    /* 1 dakikada 8'den fazla hata: sayfa bozulmuş sayılır, kendini toparlayacak şekilde yeniden yüklenir (en fazla 3 dakikada bir) */
    if(errTimes.length >= 8 && canReload()){
      var last = 0; try{ last = +localStorage.getItem("panoErrReload") || 0; }catch(x){}
      if(now - last > 180000){ try{ localStorage.setItem("panoErrReload", String(now)); }catch(y){} location.reload(); }
    }
  }
  window.onerror = function(msg, src, line){ noteError("window", msg + " @" + line); return true; };
  try{ window.addEventListener("unhandledrejection", function(ev){ noteError("promise", ev && ev.reason); }); }catch(e){}
  function applyAndRender(d){
    applyState(d);
    renderAll(); safe(tickSchedule); safe(updateCountdown); safe(updateBlackout);
    var sig = mediaSignature();
    if(sig !== mSig){ mSig = sig; sSig = soundSignature(); if(!blk) safe(startShow); }
    else { var ss = soundSignature(); if(ss !== sSig){ sSig = ss; safe(applySound); } }
  }
  /* ================= Çalışma saatleri + acil duyuru ================= */
  var blk = false, sleeping = false, emgShown = "", tvId = "";
  try{ tvId = localStorage.getItem("panoTvId") || ""; if(!tvId){ tvId = Math.random().toString(36).slice(2, 12); localStorage.setItem("panoTvId", tvId); } }catch(e){ tvId = tvId || "tv" + Math.floor(Math.random() * 1e6); }
  function hoursOpen(){
    var h = S.hours || {};
    if(h.enabled === false || h.enabled === undefined && !h.start) return true;
    var d = nowD(), n = d.getHours() * 60 + d.getMinutes(), days = h.days || [1, 2, 3, 4, 5];
    if(days.indexOf(d.getDay()) < 0) return false;
    return n >= toMinutes(h.start || "08:30") && n < toMinutes(h.end || "16:00");
  }
  function emergencyOn(){
    var em = S.emergency || {};
    return em.active === true && (!em.until || Date.now() + TIME_OFF < em.until);
  }
  function renderEmergency(em){
    var len = String(em.text || "").length;
    $("emg").className = em.color || "red";
    $("emgUse").setAttribute("href", "#i-" + (em.icon || "alert"));
    $("emgTitle").textContent = em.title || "";
    var tx = $("emgText"); tx.textContent = em.text || "";
    var fs = len <= 60 ? 72 : (len <= 140 ? 60 : (len <= 260 ? 50 : 42));
    tx.style.fontSize = fs + "px"; tx.style.lineHeight = Math.round(fs * 1.25) + "px"; tx.style.display = em.text ? "block" : "none";
    var tl = String(em.title || "").length; $("emgTitle").style.fontSize = (tl > 34 ? 72 : (tl > 22 ? 92 : 120)) + "px"; $("emgTitle").style.lineHeight = (tl > 34 ? 84 : (tl > 22 ? 104 : 132)) + "px"; $("emgTitle").style.display = em.title ? "block" : "none";
    var d = em.startedAt ? toIst(em.startedAt + 0) : nowD(); $("emgTime").textContent = em.startedAt ? "Duyuru saati " + pad(d.getHours()) + ":" + pad(d.getMinutes()) : "";
  }
  /* Ekranı durum değişince bir kez günceller: acil duyuru > uyku (çalışma saati dışı) > normal pano */
  function updateBlackout(){
    var emgOn = emergencyOn(), slp = !emgOn && !hoursOpen(), was = blk;
    var key = emgOn ? "e" + (S.emergency.nonce || 0) : (slp ? "s" : "");
    sleeping = slp; blk = emgOn || slp;
    tkPause(blk);
    if(key === emgShown) return;
    emgShown = key;
    $("sleep").style.display = slp ? "block" : "none";
    if(emgOn){ renderEmergency(S.emergency); $("emg").style.display = "block"; } else $("emg").style.display = "none";
    if(blk){ clearTimeout(mTimer); clearLayer($("sl0")); clearLayer($("sl1")); curVid = null; }
    else if(was){ mSig = mediaSignature(); startShow(); }
  }

  /* Tek zincirli yoklama: başarıda 15 sn, ardışık hatada 15→30→60 sn'ye kadar yavaşlar (kapalı sunucuyu boğmaz); çift zincir oluşmaz */
  var pollBusy = false, pollT = null, stateV = "";
  function nextPoll(){ clearTimeout(pollT); pollT = setTimeout(function(){ poll(false); }, fails === 0 ? (sleeping ? 30000 : 15000) : Math.min(60000, 15000 * Math.pow(2, Math.min(fails, 2)))); }
  function poll(first){
    if(pollBusy) return;
    pollBusy = true; clearTimeout(pollT);
    xhrJson("/api/state?_=" + (+nowD()) + "&c=tv&id=" + tvId + "&m=" + (sleeping ? "sleep" : "on") + "&e=" + errTimes.length + (stateV ? "&v=" + stateV : ""), function(d, raw){
      pollBusy = false; fails = 0; lastOkAt = Date.now(); $("net").style.display = "none";
      /* Değişiklik yoksa sunucu yalnızca {same:1} döner: büyük JSON ayrıştırma, localStorage yazımı ve yeniden çizim tamamen atlanır */
      if(d && d.same !== 1){
        stateV = d.v || "";
        /* Önbellek yalnızca durum değişince yazılır (eskiden 15 sn'de bir, logo dahil tüm durum yeniden serileştirilip yazılıyordu) */
        try{ localStorage.setItem("panoTvState", raw); }catch(e){}
        try{ applyAndRender(d); }catch(e2){ noteError("apply", e2); }
      }
      if(first) fetchWeather();
      nextPoll();
    }, function(){
      pollBusy = false; fails++;
      if(fails >= 3) $("net").style.display = "block";
      nextPoll();
    }, 8000);
  }
  /* Video ilerleme bekçisi: oynuyor görünüp 30 sn boyunca ilerlemeyen (donmuş) video yeniden başlatılır / sıradakine geçilir */
  var vwLast = -1, vwSame = 0, vwEl = null;
  /* YouTube akışını bir kez "?q=low" (sunucuda tek parça mp4, ileri sarılabilir, en uyumlu) ile yeniden ister */
  function ytLow(v, item){
    if(!item.yt || v._low || !v.parentNode) return false;
    v._low = true; soundState = "youtube: uyumlu mp4'e geçildi";
    try{ v.src = item.url + "?q=low"; var p = v.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
    return true;
  }
  function videoWatch(){
    if(blk || !curVid || !curVid.el.parentNode){ vwEl = null; vwSame = 0; return; }
    var v = curVid.el;
    if(v !== vwEl){ vwEl = v; vwLast = -1; vwSame = 0; }
    if(v.ended || v.error){ return; }
    if(v.paused){ try{ var pp = v.play(); if(pp && pp.catch) pp.catch(function(){}); }catch(e){} }
    if(v.currentTime === vwLast){ vwSame++; } else { vwSame = 0; vwLast = v.currentTime; }
    if(vwSame >= 6){
      vwSame = 0;
      if(ytLow(v, curVid.item)) return;
      var list = mediaList();
      if(list.length <= 1){ loopN++; var base = v._low ? curVid.item.url + "?q=low" : curVid.item.url; v.src = base + (base.indexOf("?") < 0 ? "?r=" : "&r=") + loopN; try{ var p2 = v.play(); if(p2 && p2.catch) p2.catch(function(){}); }catch(e2){} }
      else nextSlide();
    }
  }

  /* ================= Başlat ================= */
  fit();
  window.addEventListener("resize", fit);
  setInterval(fit, 5000);
  try{ var c = localStorage.getItem("panoTvState"); if(c){ applyState(JSON.parse(c)); } }catch(e){}
  /* Tek saniye döngüsü, (sunucu saatine göre) saniye sınırına hizalı: setInterval(1000) kayar; büyük saat ekranda
     zaman zaman bir saniyeyi atlıyor ya da iki kez gösteriyordu. Bir sonraki çağrı her turda yeniden hizalanır ve
     en başta planlanır, böylece içerideki bir hata döngüyü öldüremez. */
  var lastTick = Date.now();
  function secondLoop(){
    setTimeout(secondLoop, 1000 - ((Date.now() + TIME_OFF) % 1000) + 10);
    var t = Date.now();
    /* Saat sıçraması = TV uyudu/sekme dondu: hemen yokla; 10 dk'dan uzunsa (sunucu erişilebilirse) sayfayı tazele */
    if(t - lastTick > 20000 || lastTick - t > 20000){ poll(false); if(t - lastTick > 600000 && canReload()){ location.reload(); return; } }
    lastTick = t;
    safe(tickClock); safe(updateCountdown); safe(tickSchedule); safe(updateBlackout);
  }
  safe(tickClock); secondLoop();
  setInterval(function(){ safe(renderScheduleList); safe(renderMenu); safe(renderModule); safe(renderDuty); }, 60000);
  setInterval(function(){ safe(videoWatch); }, 5000);
  if(haveState){ renderAll(); mSig = mediaSignature(); startShow(); }
  poll(true);
  setInterval(function(){ safe(fetchWeather); }, 30 * 60 * 1000);
  setTimeout(function(){ tkBuild(false); }, 1500); setTimeout(function(){ tkBuild(false); safe(fitBrand); }, 4000);
  try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ tkBuild(false); safe(fitBrand); }); }catch(e){}
  setInterval(function(){ safe(applyAutoSound); }, 2000);
  /* Sorun giderme: adresin sonuna ?debug=1 ekleyince sol altta ses durumu görünür */
  if(/[?&]debug=1/.test(location.search)){ $("dbg").style.display = "block"; setInterval(function(){ $("dbg").textContent = "ses: " + (soundState || "-") + " | " + pad(nowD().getHours()) + ":" + pad(nowD().getMinutes()); }, 1000); }
  /* Zayıf TV bellek sızıntılarına karşı her gece 03:30'da sayfayı yenile */
  setInterval(function(){ var d = nowD(); if(d.getHours() === 3 && d.getMinutes() === 30 && d.getSeconds() < 30 && canReload()){ location.reload(); } }, 20000);
})();
</script>
